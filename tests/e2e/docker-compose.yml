name: zettide-e2e

x-data-node-environment: &data-node-environment
  # grpc-lite currently needs numeric endpoints unless a resolver runtime is installed.
  ZETTIDE_CONTROLLER_ENDPOINT: 172.30.0.10:8001
  ZETTIDE_DATA_NODE_LISTEN: 0.0.0.0:7001
  ZETTIDE_REPLICA_LISTEN: 0.0.0.0:7443
  ZETTIDE_CLUSTER_ID: 0198f54d-5c2a-7000-8000-000000000001
  ZETTIDE_POOL_ID_FILE: /bootstrap/pool-id
  ZETTIDE_MEMBER_METADATA_CAPACITY: "1048576"
  ZETTIDE_MEMBER_CAPACITY: "67108864"
  ZETTIDE_EXTENT_SIZE: "4194304"
  ZETTIDE_ISCSI_LUN: "1"
  ZETTIDE_ISCSI_SIZE: 64M

x-data-node-service: &data-node-service
  build:
    context: ../..
    dockerfile: tests/e2e/Dockerfile
    target: data-node
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  security_opt:
    - seccomp=unconfined
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        nc -z 127.0.0.1 7001 &&
        nc -z 127.0.0.1 7443 &&
        tgtadm --lld iscsi --op show --mode target | grep -Fq iqn.2026-08.io.zettide
    interval: 1s
    timeout: 2s
    retries: 60
  stop_grace_period: 15s

services:
  controller:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      target: controller
    command:
      - --node-id
      - "1"
      - --cluster-id
      - 0198f54d-5c2a-7000-8000-000000000001
      - --management-listen
      - 0.0.0.0:8001
      - --raft-listen
      - 127.0.0.1:9001
      - --raft-advertise
      - 127.0.0.1:9001
      - --data-dir
      - /var/lib/zettide-controller
      - --peer
      - 1=127.0.0.1:9001
    security_opt:
      - seccomp=unconfined
    ports:
      - "8001:8001"
    volumes:
      - controller-data:/var/lib/zettide-controller
    networks:
      zettide:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8001"]
      interval: 1s
      timeout: 1s
      retries: 30
    stop_grace_period: 10s

  bootstrap:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      target: smoke
    entrypoint: ["/usr/local/bin/zettide-e2e-bootstrap"]
    environment:
      ZETTIDE_CONTROLLER_ENDPOINT: controller:8001
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - cluster-bootstrap:/bootstrap
    networks:
      - zettide
    restart: "no"

  data-node-1:
    <<: *data-node-service
    environment:
      <<: *data-node-environment
      ZETTIDE_DATA_NODE_ADVERTISE: 172.30.0.11:7001
      ZETTIDE_DATA_NODE_HOST: data-node-1
      ZETTIDE_REPLICA_ADVERTISE: 172.30.0.11:7443
      ZETTIDE_REPLICA_PEER_KEYS: |-
        0198f54d-5c2a-7000-8000-000000000021 1212121212121212121212121212121212121212121212121212121212121212
        0198f54d-5c2a-7000-8000-000000000031 1313131313131313131313131313131313131313131313131313131313131313
      ZETTIDE_REPLICA_OUTBOUND_KEYS: |-
        0198f54d-5c2a-7000-8000-000000000021 2121212121212121212121212121212121212121212121212121212121212121
        0198f54d-5c2a-7000-8000-000000000031 3131313131313131313131313131313131313131313131313131313131313131
      ZETTIDE_REPLICA_SIGNING_SEED: "0101010101010101010101010101010101010101010101010101010101010101"
      ZETTIDE_NODE_ID: 0198f54d-5c2a-7000-8000-000000000011
      ZETTIDE_REQUEST_ID: 0198f54d-5c2a-7000-8000-000000000012
      ZETTIDE_MEMBER_ID: 0198f54d-5c2a-7000-8000-000000000013
      ZETTIDE_FAILURE_DOMAIN: rack-a
      ZETTIDE_ISCSI_TARGET: iqn.2026-08.io.zettide:e2e-1
    ports:
      - "3261:3260"
      - "7001:7001"
    volumes:
      - cluster-bootstrap:/bootstrap:ro
      - data-node-1-data:/var/lib/zettide-data-node
    networks:
      zettide:
        ipv4_address: 172.30.0.11

  data-node-2:
    <<: *data-node-service
    environment:
      <<: *data-node-environment
      ZETTIDE_DATA_NODE_ADVERTISE: 172.30.0.12:7001
      ZETTIDE_DATA_NODE_HOST: data-node-2
      ZETTIDE_REPLICA_ADVERTISE: 172.30.0.12:7443
      ZETTIDE_REPLICA_PEER_KEYS: |-
        0198f54d-5c2a-7000-8000-000000000011 2121212121212121212121212121212121212121212121212121212121212121
        0198f54d-5c2a-7000-8000-000000000031 2323232323232323232323232323232323232323232323232323232323232323
      ZETTIDE_REPLICA_OUTBOUND_KEYS: |-
        0198f54d-5c2a-7000-8000-000000000011 1212121212121212121212121212121212121212121212121212121212121212
        0198f54d-5c2a-7000-8000-000000000031 3232323232323232323232323232323232323232323232323232323232323232
      ZETTIDE_REPLICA_SIGNING_SEED: "0202020202020202020202020202020202020202020202020202020202020202"
      ZETTIDE_NODE_ID: 0198f54d-5c2a-7000-8000-000000000021
      ZETTIDE_REQUEST_ID: 0198f54d-5c2a-7000-8000-000000000022
      ZETTIDE_MEMBER_ID: 0198f54d-5c2a-7000-8000-000000000023
      ZETTIDE_FAILURE_DOMAIN: rack-b
      ZETTIDE_ISCSI_TARGET: iqn.2026-08.io.zettide:e2e-2
    ports:
      - "3262:3260"
      - "7002:7001"
    volumes:
      - cluster-bootstrap:/bootstrap:ro
      - data-node-2-data:/var/lib/zettide-data-node
    networks:
      zettide:
        ipv4_address: 172.30.0.12

  data-node-3:
    <<: *data-node-service
    environment:
      <<: *data-node-environment
      ZETTIDE_DATA_NODE_ADVERTISE: 172.30.0.13:7001
      ZETTIDE_DATA_NODE_HOST: data-node-3
      ZETTIDE_REPLICA_ADVERTISE: 172.30.0.13:7443
      ZETTIDE_REPLICA_PEER_KEYS: |-
        0198f54d-5c2a-7000-8000-000000000011 3131313131313131313131313131313131313131313131313131313131313131
        0198f54d-5c2a-7000-8000-000000000021 3232323232323232323232323232323232323232323232323232323232323232
      ZETTIDE_REPLICA_OUTBOUND_KEYS: |-
        0198f54d-5c2a-7000-8000-000000000011 1313131313131313131313131313131313131313131313131313131313131313
        0198f54d-5c2a-7000-8000-000000000021 2323232323232323232323232323232323232323232323232323232323232323
      ZETTIDE_REPLICA_SIGNING_SEED: "0303030303030303030303030303030303030303030303030303030303030303"
      ZETTIDE_NODE_ID: 0198f54d-5c2a-7000-8000-000000000031
      ZETTIDE_REQUEST_ID: 0198f54d-5c2a-7000-8000-000000000032
      ZETTIDE_MEMBER_ID: 0198f54d-5c2a-7000-8000-000000000033
      ZETTIDE_FAILURE_DOMAIN: rack-c
      ZETTIDE_ISCSI_TARGET: iqn.2026-08.io.zettide:e2e-3
    ports:
      - "3263:3260"
      - "7003:7001"
    volumes:
      - cluster-bootstrap:/bootstrap:ro
      - data-node-3-data:/var/lib/zettide-data-node
    networks:
      zettide:
        ipv4_address: 172.30.0.13

  smoke:
    profiles: ["smoke"]
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      target: smoke
    depends_on:
      controller:
        condition: service_healthy
      data-node-1:
        condition: service_healthy
      data-node-2:
        condition: service_healthy
      data-node-3:
        condition: service_healthy
    volumes:
      - cluster-bootstrap:/bootstrap
    networks:
      - zettide

networks:
  zettide:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  cluster-bootstrap:
  controller-data:
  data-node-1-data:
  data-node-2-data:
  data-node-3-data:
