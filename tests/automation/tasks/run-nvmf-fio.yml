---
- name: Initialize retained Pool configuration | {{ zettide_optimize }}
  ansible.builtin.set_fact:
    zettide_nvmf_pool_config: "{{ zettide_raw_device | default({}) }}"
  when: zettide_test_profile == 'nvmf-catalog-optane-fio'

- name: Require retained Pool identity | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_nvmf_pool_config.path is defined
      - zettide_nvmf_pool_config.serial is defined
      - zettide_nvmf_pool_config.pool_id is defined
      - zettide_nvmf_pool_config.pool_id | length == 32
      - ansible_play_hosts_all | length == 1
    fail_msg: "Configure path, serial, and pool_id for the retained Pool."
  when: zettide_test_profile == 'nvmf-catalog-optane-fio'

- name: Read retained Pool device serial | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - lsblk
      - --nodeps
      - --noheadings
      - --output
      - SERIAL
      - "{{ zettide_nvmf_pool_config.path }}"
  changed_when: false
  register: zettide_nvmf_pool_serial
  when: zettide_test_profile == 'nvmf-catalog-optane-fio'

- name: Require retained Pool device serial | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_nvmf_pool_serial.stdout | trim == zettide_nvmf_pool_config.serial
    fail_msg: "The retained Pool device serial does not match the configured guard."
  when: zettide_test_profile == 'nvmf-catalog-optane-fio'

- name: Extract SPDK source | {{ zettide_optimize }}
  ansible.builtin.unarchive:
    src: "{{ zettide_repository_staging.path }}/spdk-source.tar.gz"
    dest: "{{ zettide_remote_workspace.path }}"

- name: Configure SPDK for NVMe-oF | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - ./configure
      - --with-shared
      - "{{ '--with-rdma' if zettide_test_profile == 'nvmf-catalog-rxe-fio' else '--without-rdma' }}"
      - --without-uring
      - --disable-tests
      - --disable-unit-tests
      - --disable-examples
      - --disable-apps
      - --without-nvme-cuse
      - --without-fsdev
  args:
    chdir: "{{ zettide_remote_workspace.path }}/spdk"
  changed_when: true

- name: Build SPDK for NVMe-oF | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - make
      - "-j{{ ansible_facts.processor_vcpus | default(2) }}"
  args:
    chdir: "{{ zettide_remote_workspace.path }}/spdk"
  changed_when: true

- name: Build the NVMe-oF benchmark target | {{ zettide_optimize }}
  ansible.builtin.shell:
    cmd: >-
      cc -O3 -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Wno-unused-parameter
      -Iservices/data-node -Itest services/data-node/spdk/runtime.c services/data-node/spdk/bdev_provider.c
      services/data-node/spdk/nvmf_tcp_export.c tests/spdk_runtime.c tests/spdk_nvmf_benchmark.c
      -o tests/spdk-nvmf-benchmark -pthread -Wl,--no-as-needed
      $(PKG_CONFIG_PATH=./spdk/build/lib/pkgconfig pkg-config --cflags --libs
      spdk_event spdk_event_bdev spdk_vhost spdk_event_nvmf spdk_bdev_modules spdk_env_dpdk
      spdk_nvmf spdk_sock_modules spdk_syslibs) -Wl,--as-needed
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  changed_when: true
  when: zettide_test_profile == 'nvmf-fio'

- name: Build the Catalog NVMe-oF benchmark target | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - zig
      - build
      - -Dspdk=true
      - "-Doptimize={{ zettide_optimize }}"
      - build-nvmf-catalog-benchmark
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    PKG_CONFIG_PATH: "{{ zettide_remote_workspace.path }}/spdk/build/lib/pkgconfig"
  changed_when: true
  when: zettide_test_profile in ['nvmf-catalog-fio', 'nvmf-catalog-rxe-fio', 'nvmf-catalog-mapped-fio', 'nvmf-catalog-optane-fio']

- name: Link the Catalog NVMe-oF benchmark target | {{ zettide_optimize }}
  ansible.builtin.shell:
    cmd: >-
      cc -O3 -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Wno-unused-parameter
      -Iservices/data-node -Itest services/data-node/spdk/runtime.c services/data-node/spdk/bdev_provider.c
      services/data-node/spdk/iscsi_export.c services/data-node/spdk/nvmf_tcp_export.c tests/spdk_runtime.c tests/spdk_catalog_nvmf_benchmark_main.c
      zig-out/lib/libzettide-spdk-catalog-nvmf-benchmark.a
      -o tests/spdk-catalog-nvmf-benchmark -pthread -lstdc++ -Wl,--no-as-needed
      $(PKG_CONFIG_PATH=./spdk/build/lib/pkgconfig pkg-config --cflags --libs
      spdk_event spdk_event_bdev spdk_event_scsi spdk_event_iscsi spdk_vhost
      spdk_event_nvmf spdk_bdev_modules spdk_env_dpdk spdk_scsi spdk_iscsi
      spdk_nvmf spdk_sock_modules spdk_syslibs) -Wl,--as-needed
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  changed_when: true
  when: zettide_test_profile in ['nvmf-catalog-fio', 'nvmf-catalog-rxe-fio', 'nvmf-catalog-mapped-fio', 'nvmf-catalog-optane-fio']

- name: Discover SPDK shared library paths | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - pkg-config
      - --libs-only-L
      - spdk_event
      - spdk_event_bdev
      - spdk_vhost
      - spdk_event_nvmf
      - spdk_bdev_modules
      - spdk_env_dpdk
      - spdk_nvmf
      - spdk_sock_modules
      - spdk_syslibs
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    PKG_CONFIG_PATH: "{{ zettide_remote_workspace.path }}/spdk/build/lib/pkgconfig"
  changed_when: false
  register: zettide_spdk_library_flags

- name: Run NVMe-oF fio | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - bash
      - tests/spdk-nvmf-fio.sh
      - >-
        {{ zettide_remote_workspace.path ~
           ('/tests/spdk-catalog-nvmf-benchmark'
            if zettide_test_profile in ['nvmf-catalog-fio', 'nvmf-catalog-rxe-fio', 'nvmf-catalog-mapped-fio', 'nvmf-catalog-optane-fio']
            else '/tests/spdk-nvmf-benchmark') }}
      - "{{ zettide_remote_workspace.path }}/nvmf-ready"
      - "{{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/{{ zettide_test_profile }}"
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    LD_LIBRARY_PATH: >-
      {{ zettide_spdk_library_flags.stdout.split()
         | map('regex_replace', '^-L', '') | join(':') }}
    ZETTIDE_NVMF_FIO_RUNTIME: "{{ zettide_nvmf_fio_runtime }}"
    ZETTIDE_NVMF_FIO_RAMP_TIME: "{{ zettide_nvmf_fio_ramp_time }}"
    ZETTIDE_NVMF_TRANSPORT: "{{ 'rdma' if zettide_test_profile == 'nvmf-catalog-rxe-fio' else 'tcp' }}"
    ZETTIDE_NVMF_TARGET_ADDR: "{{ '192.0.2.2' if zettide_test_profile == 'nvmf-catalog-rxe-fio' else '127.0.0.1' }}"
    ZETTIDE_NVMF_TARGET_PORT: "44220"
    ZETTIDE_NVMF_FIO_SIZE: >-
      {{ '256M'
         if zettide_test_profile in ['nvmf-catalog-mapped-fio', 'nvmf-catalog-optane-fio']
         else '8G' }}
    ZETTIDE_NVMF_EXPECTED_SIZE: >-
      {{ '' if zettide_test_profile == 'nvmf-catalog-optane-fio' else '68719476736' }}
    ZETTIDE_NVMF_TARGET_ARGUMENT: >-
      {{ zettide_nvmf_pool_config.path
         if zettide_test_profile == 'nvmf-catalog-optane-fio'
         else (zettide_remote_workspace.path ~ '/catalog-member'
                if zettide_test_profile in ['nvmf-catalog-fio', 'nvmf-catalog-rxe-fio', 'nvmf-catalog-mapped-fio'] else '') }}
    ZETTIDE_NVMF_TARGET_MODE: >-
      {{ 'mapped' if zettide_test_profile == 'nvmf-catalog-mapped-fio'
         else ('existing' if zettide_test_profile == 'nvmf-catalog-optane-fio' else '') }}
    ZETTIDE_NVMF_TARGET_EXPECTED_POOL_ID: >-
      {{ zettide_nvmf_pool_config.pool_id
         if zettide_test_profile == 'nvmf-catalog-optane-fio' else '' }}
  changed_when: true
  failed_when: false
  register: zettide_nvmf_fio_result

- name: Record NVMe-oF fio lifecycle | {{ zettide_optimize }}
  ansible.builtin.copy:
    content: |-
      rc={{ zettide_nvmf_fio_result.rc | default(1) }}
      {{ zettide_nvmf_fio_result.stdout | default('') }}
      {{ zettide_nvmf_fio_result.stderr | default(zettide_nvmf_fio_result.msg | default('')) }}
    dest: "{{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/{{ zettide_test_profile }}/ansible.log"
    mode: "0644"

- name: Require NVMe-oF fio lifecycle | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_nvmf_fio_result.rc | default(1) == 0
    fail_msg: "NVMe-oF fio failed; inspect the fetched {{ zettide_test_profile }} logs."
