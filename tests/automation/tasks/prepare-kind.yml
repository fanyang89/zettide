---
- name: Download pinned kind | {{ zettide_optimize }}
  ansible.builtin.get_url:
    url: https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
    dest: "{{ zettide_repository_staging.path }}/kind-v0.32.0-linux-amd64"
    checksum: sha256:50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
    mode: "0755"
  delegate_to: localhost
  become: false
  register: zettide_kind_download
  retries: 3
  delay: 5
  until: zettide_kind_download is succeeded

- name: Download pinned kubectl | {{ zettide_optimize }}
  ansible.builtin.get_url:
    url: https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
    dest: "{{ zettide_repository_staging.path }}/kubectl-v1.36.1-linux-amd64"
    checksum: sha256:629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
    mode: "0755"
  delegate_to: localhost
  become: false
  register: zettide_kubectl_download
  retries: 3
  delay: 5
  until: zettide_kubectl_download is succeeded

- name: Create remote kind tool directory | {{ zettide_optimize }}
  ansible.builtin.file:
    path: "{{ zettide_remote_workspace.path }}/csi-tools"
    state: directory
    mode: "0755"

- name: Copy pinned kind tools to the remote host | {{ zettide_optimize }}
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ zettide_remote_workspace.path }}/csi-tools/{{ item.dest }}"
    mode: "0755"
  loop:
    - src: "{{ zettide_repository_staging.path }}/kind-v0.32.0-linux-amd64"
      dest: kind
    - src: "{{ zettide_repository_staging.path }}/kubectl-v1.36.1-linux-amd64"
      dest: kubectl
