---
- name: Run single-node Zettide block tests on remote Linux hosts
  hosts: zettide_test
  gather_facts: true
  become: true

  vars:
    zettide_repository_root: "{{ playbook_dir }}/../.."
    zettide_test_profile: "{{ zettide_test_profile_override | default('block') }}"
    zettide_optimize_modes: "{{ zettide_optimize_modes_override | default(['Debug', 'ReleaseSafe']) }}"
    zettide_zig: zig
    zettide_zig_version: 0.17.0
    zettide_results_root: "{{ zettide_repository_root }}/test-results/ansible"
    zettide_keep_remote_workspace: false
    zettide_raw_timeout: 86400
    zettide_nvmf_fio_runtime: 20
    zettide_nvmf_fio_ramp_time: 5
    zettide_spdk_profiles:
      - nvmf-fio
      - nvmf-catalog-fio
      - nvmf-catalog-rxe-fio
      - nvmf-catalog-mapped-fio
      - nvmf-catalog-optane-fio
      - iscsi-catalog-fio
    zettide_profile_tasks:
      block: tasks/run-mode.yml
      nvmf-fio: tasks/run-nvmf-fio.yml
      nvmf-catalog-fio: tasks/run-nvmf-fio.yml
      nvmf-catalog-rxe-fio: tasks/run-nvmf-fio.yml
      nvmf-catalog-mapped-fio: tasks/run-nvmf-fio.yml
      nvmf-catalog-optane-fio: tasks/run-nvmf-fio.yml
      iscsi-catalog-fio: tasks/run-iscsi-fio.yml
    zettide_packages:
      RedHat: [gcc, git, kmod, sudo, util-linux, e2fsprogs]
      Debian: [build-essential, git, kmod, sudo, util-linux, e2fsprogs]
    zettide_nvmf_packages:
      RedHat:
        - autoconf
        - automake
        - cmake
        - elfutils-libelf-devel
        - fio
        - gcc
        - gcc-c++
        - jq
        - kmod
        - libaio-devel
        - libtool
        - libuuid-devel
        - make
        - meson
        - nasm
        - ninja-build
        - numactl-devel
        - nvme-cli
        - openssl-devel
        - pkgconf-pkg-config
        - python3-pyelftools
      Debian:
        - autoconf
        - automake
        - build-essential
        - cmake
        - fio
        - jq
        - kmod
        - libaio-dev
        - libelf-dev
        - libtool
        - libnuma-dev
        - libssl-dev
        - meson
        - nasm
        - ninja-build
        - nvme-cli
        - pkg-config
        - python3-pyelftools
        - uuid-dev
    zettide_nvmf_rdma_packages:
      RedHat: [iproute, libibverbs-devel, libibverbs-utils, librdmacm-devel, psmisc, rdma-core, util-linux]
      Debian: [ibverbs-utils, iproute2, libibverbs-dev, librdmacm-dev, psmisc, rdma-core, util-linux]
    zettide_iscsi_packages:
      RedHat: [iscsi-initiator-utils]
      Debian: [open-iscsi]

  pre_tasks:
    - name: Require a supported target family and profile before staging or installing
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in zettide_packages
          - zettide_test_profile in zettide_profile_tasks
        fail_msg: "Use the block profile or a retained SPDK profile; filesystem and CSI profiles are retired."

    - name: Read the source revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
      args:
        chdir: "{{ zettide_repository_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: zettide_source_revision

    - name: Read the source working tree status
      ansible.builtin.command:
        argv: [git, status, --short]
      args:
        chdir: "{{ zettide_repository_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: zettide_source_status

    - name: Create the local staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: zettide-ansible-
      delegate_to: localhost
      become: false
      run_once: true
      register: zettide_repository_staging

    - name: Archive the current working tree
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=.git
          - --exclude=.venv
          - --exclude=.tools
          - --exclude=.zig-cache
          - --exclude=zig-out
          - --exclude=core.*
          - --exclude=vendor/spdk
          - --exclude=test-results
          - --exclude=tests/automation/inventory.ini
          - -C
          - "{{ zettide_repository_root }}"
          - -czf
          - "{{ zettide_repository_staging.path }}/source.tar.gz"
          - .
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Hash the staged source archive
      ansible.builtin.stat:
        path: "{{ zettide_repository_staging.path }}/source.tar.gz"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      run_once: true
      register: zettide_source_archive

    - name: Archive the pinned SPDK source
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=.git
          - --exclude=build
          - --exclude=build-tmp
          - -C
          - "{{ zettide_repository_root }}/vendor"
          - -czf
          - "{{ zettide_repository_staging.path }}/spdk-source.tar.gz"
          - spdk
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true
      when: zettide_test_profile in zettide_spdk_profiles

    - name: Read the pinned SPDK source revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
      args:
        chdir: "{{ zettide_repository_root }}/vendor/spdk"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: zettide_spdk_source_revision
      when: zettide_test_profile in zettide_spdk_profiles

    - name: Hash the staged SPDK source archive
      ansible.builtin.stat:
        path: "{{ zettide_repository_staging.path }}/spdk-source.tar.gz"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      run_once: true
      register: zettide_spdk_source_archive
      when: zettide_test_profile in zettide_spdk_profiles

  tasks:
    - name: Create the remote workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: zettide-test-
      register: zettide_remote_workspace

    - name: Create the remote result directory
      ansible.builtin.file:
        path: "{{ zettide_remote_workspace.path }}/test-results"
        state: directory
        mode: "0755"

    - name: Run the remote test lifecycle
      block:
        - name: Install test dependencies
          ansible.builtin.package:
            name: >-
              {{ zettide_packages[ansible_facts.os_family]
                 + (zettide_nvmf_packages[ansible_facts.os_family]
                    if zettide_test_profile in zettide_spdk_profiles else [])
                 + (zettide_nvmf_rdma_packages[ansible_facts.os_family]
                    if zettide_test_profile == 'nvmf-catalog-rxe-fio' else [])
                 + (zettide_iscsi_packages[ansible_facts.os_family]
                    if zettide_test_profile == 'iscsi-catalog-fio' else []) }}
            state: present

        - name: Load block transport modules
          ansible.builtin.command:
            argv: [modprobe, "{{ item }}"]
          loop: >-
            {{ ['nvme', 'nvme-rdma', 'rdma_rxe']
               if zettide_test_profile == 'nvmf-catalog-rxe-fio'
               else (['iscsi_tcp'] if zettide_test_profile == 'iscsi-catalog-fio'
               else (['loop'] if zettide_test_profile == 'block' else ['nvme', 'nvme-tcp'])) }}
          changed_when: false

        - name: Check the remote Zig version
          ansible.builtin.command:
            argv: ["{{ zettide_zig }}", version]
          changed_when: false
          register: zettide_remote_zig

        - name: Require the pinned Zig version
          ansible.builtin.assert:
            that:
              - zettide_remote_zig.stdout == zettide_zig_version
            fail_msg: "Remote Zig must be {{ zettide_zig_version }}, found {{ zettide_remote_zig.stdout }}."

        - name: Extract the current working tree
          ansible.builtin.unarchive:
            src: "{{ zettide_repository_staging.path }}/source.tar.gz"
            dest: "{{ zettide_remote_workspace.path }}"

        - name: Read the remote fio version
          ansible.builtin.command:
            argv: [fio, --version]
          changed_when: false
          register: zettide_remote_fio
          when: zettide_test_profile in zettide_spdk_profiles

        - name: Record the test manifest
          ansible.builtin.copy:
            content: "{{ zettide_test_manifest | to_nice_json }}\n"
            dest: "{{ zettide_remote_workspace.path }}/test-results/manifest.json"
            mode: "0644"
          vars:
            zettide_test_manifest:
              profile: "{{ zettide_test_profile }}"
              optimize_modes: "{{ zettide_optimize_modes }}"
              inventory_host: "{{ inventory_hostname }}"
              remote_host: "{{ ansible_host | default(inventory_hostname) }}"
              distribution: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
              architecture: "{{ ansible_facts.architecture }}"
              kernel: "{{ ansible_facts.kernel }}"
              source_revision: "{{ zettide_source_revision.stdout }}"
              source_status: "{{ zettide_source_status.stdout_lines }}"
              source_archive_sha256: "{{ zettide_source_archive.stat.checksum }}"
              spdk_source_revision: "{{ zettide_spdk_source_revision.stdout | default('not-recorded') }}"
              spdk_source_archive_sha256: "{{ zettide_spdk_source_archive.stat.checksum | default('not-recorded') }}"
              zig_version: "{{ zettide_remote_zig.stdout }}"
              fio_version: "{{ zettide_remote_fio.stdout | default('not-recorded') }}"
              nvmf_transport: >-
                {{ 'rdma' if zettide_test_profile == 'nvmf-catalog-rxe-fio'
                   else ('tcp' if zettide_test_profile.startswith('nvmf-') else '') }}
              fio_runtime: "{{ zettide_nvmf_fio_runtime }}"
              fio_ramp_time: "{{ zettide_nvmf_fio_ramp_time }}"
              raw_device: "{{ zettide_raw_device | default({}) }}"
              started_utc: "{{ ansible_facts['date_time']['iso8601'] }}"

        - name: Run each optimization mode
          ansible.builtin.include_tasks:
            file: "{{ zettide_profile_tasks[zettide_test_profile] }}"
          loop: "{{ zettide_optimize_modes }}"
          loop_control:
            loop_var: zettide_optimize

      always:
        - name: Archive remote test results
          ansible.builtin.command:
            argv: [tar, -C, "{{ zettide_remote_workspace.path }}", -czf, "{{ zettide_remote_workspace.path }}/results.tar.gz", test-results]
          changed_when: true
          failed_when: false
          register: zettide_archive_results

        - name: Fetch remote test results
          ansible.builtin.fetch:
            src: "{{ zettide_remote_workspace.path }}/results.tar.gz"
            dest: >-
              {{ zettide_results_root ~ '/' ~ inventory_hostname ~ '-' ~
                 ansible_facts['date_time']['iso8601_basic_short'] ~ '-' ~
                 zettide_source_revision.stdout[:12] ~ '.tar.gz' }}
            flat: true
          register: zettide_fetch_results
          when: zettide_archive_results.rc == 0

        - name: Remove the remote workspace
          ansible.builtin.file:
            path: "{{ zettide_remote_workspace.path }}"
            state: absent
          when:
            - not zettide_keep_remote_workspace | bool
            - zettide_archive_results.rc == 0
            - not (zettide_fetch_results.failed | default(true))

        - name: Remove the local staging directory
          ansible.builtin.file:
            path: "{{ zettide_repository_staging.path }}"
            state: absent
          delegate_to: localhost
          become: false
          run_once: true

        - name: Require archived and fetched test results
          ansible.builtin.assert:
            that:
              - zettide_archive_results.rc == 0
              - not (zettide_fetch_results.skipped | default(false))
              - not (zettide_fetch_results.failed | default(true))
            fail_msg: "Test results were not archived and fetched; the remote workspace was retained when possible."
