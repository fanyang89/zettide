syntax = "proto3";

package zettide.control.v1;

service PoolService {
  rpc CreatePool(CreatePoolRequest) returns (CreatePoolResponse);
  rpc GetPool(GetPoolRequest) returns (GetPoolResponse);
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
}

service NodeService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
}

service MemberService {
  rpc RegisterMember(RegisterMemberRequest) returns (RegisterMemberResponse);
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
}

service HeartbeatService {
  rpc ReportHeartbeat(ReportHeartbeatRequest) returns (ReportHeartbeatResponse);
  rpc GetHeartbeat(GetHeartbeatRequest) returns (GetHeartbeatResponse);
}

service VolumeService {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse);
  rpc UpdateVolume(UpdateVolumeRequest) returns (UpdateVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
}

// Node-local service used by the control plane to manage data replicas.
service DataService {
  rpc EnsureReplica(EnsureReplicaRequest) returns (EnsureReplicaResponse);
  rpc InspectReplica(InspectReplicaRequest) returns (InspectReplicaResponse);
  rpc DeleteReplica(DeleteReplicaRequest) returns (DeleteReplicaResponse);
  rpc IdentifyHolder(IdentifyHolderRequest) returns (IdentifyHolderResponse);
  rpc StagePrimary(StagePrimaryRequest) returns (StagePrimaryResponse);
  rpc FenceReplica(FenceReplicaRequest) returns (FenceReplicaResponse);
  rpc RecoverPrimary(RecoverPrimaryRequest) returns (RecoverPrimaryResponse);
  rpc MarkPrimaryReady(MarkPrimaryReadyRequest) returns (MarkPrimaryReadyResponse);
  rpc InspectPrimary(InspectPrimaryRequest) returns (InspectPrimaryResponse);
}

message Pool {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 created_at_unix_ms = 4;
  uint64 created_revision = 5;
}

message CreatePoolRequest {
  string request_id = 1;
  string name = 2;
  string description = 3;
}

message CreatePoolResponse {
  Pool pool = 1;
}

message GetPoolRequest {
  oneof selector {
    string id = 1;
    string name = 2;
  }
}

message GetPoolResponse {
  Pool pool = 1;
}

message ListPoolsRequest {
  uint32 page_size = 1;
  bytes page_token = 2;
}

message ListPoolsResponse {
  repeated Pool pools = 1;
  bytes next_page_token = 2;
}

message Node {
  string id = 1;
  bytes cluster_id = 2;
  string control_endpoint = 3;
  string nvmf_endpoint = 4;
  string failure_domain = 5;
  uint64 capability_bits = 6;
  uint32 protocol_version = 7;
  int64 registered_at_unix_ms = 8;
  uint64 registered_revision = 9;
}

message RegisterNodeRequest {
  string request_id = 1;
  string node_id = 2;
  bytes cluster_id = 3;
  string control_endpoint = 4;
  string nvmf_endpoint = 5;
  string failure_domain = 6;
  uint64 capability_bits = 7;
  uint32 protocol_version = 8;
}

message RegisterNodeResponse {
  Node node = 1;
}

message GetNodeRequest {
  string node_id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

message ListNodesRequest {
  uint32 page_size = 1;
  bytes page_token = 2;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  bytes next_page_token = 2;
}

message Member {
  bytes id = 1;
  string pool_id = 2;
  string node_id = 3;
  bytes local_set_id = 4;
  uint32 member_slot = 5;
  bytes birth_topology_digest = 6;
  uint64 metadata_capacity_bytes = 7;
  uint64 data_capacity_bytes = 8;
  uint32 extent_size_bytes = 9;
  int64 registered_at_unix_ms = 10;
  uint64 registered_revision = 11;
}

message RegisterMemberRequest {
  string request_id = 1;
  bytes cluster_id = 2;
  bytes member_id = 3;
  string pool_id = 4;
  string node_id = 5;
  bytes local_set_id = 6;
  uint32 member_slot = 7;
  bytes birth_topology_digest = 8;
  uint64 metadata_capacity_bytes = 9;
  uint64 data_capacity_bytes = 10;
  uint32 extent_size_bytes = 11;
}

message RegisterMemberResponse {
  Member member = 1;
}

message GetMemberRequest {
  bytes member_id = 1;
}

message GetMemberResponse {
  Member member = 1;
}

message ListMembersRequest {
  uint32 page_size = 1;
  bytes page_token = 2;
}

message ListMembersResponse {
  repeated Member members = 1;
  bytes next_page_token = 2;
}

enum MemberHeartbeatState {
  MEMBER_HEARTBEAT_STATE_UNSPECIFIED = 0;
  MEMBER_HEARTBEAT_STATE_PRESENT = 1;
  MEMBER_HEARTBEAT_STATE_UNAVAILABLE = 2;
}

enum HeartbeatFreshness {
  HEARTBEAT_FRESHNESS_UNSPECIFIED = 0;
  HEARTBEAT_FRESHNESS_FRESH = 1;
  HEARTBEAT_FRESHNESS_STALE = 2;
}

message MemberCapacity {
  uint64 free_extent_count = 1;
  uint64 allocated_extent_count = 2;
  uint64 reserved_extent_count = 3;
  uint64 retired_extent_count = 4;
}

message MemberHeartbeat {
  bytes member_id = 1;
  bytes local_set_id = 2;
  uint32 member_slot = 3;
  MemberHeartbeatState state = 4;
  MemberCapacity capacity = 5;
}

message ReportHeartbeatRequest {
  bytes cluster_id = 1;
  string node_id = 2;
  uint64 incarnation = 3;
  uint64 sequence = 4;
  repeated MemberHeartbeat members = 5;
}

message NodeHeartbeat {
  string node_id = 1;
  uint64 incarnation = 2;
  uint64 sequence = 3;
  int64 accepted_at_unix_ms = 4;
  uint64 leader_term = 5;
  repeated MemberHeartbeat members = 6;
}

message ReportHeartbeatResponse {
  NodeHeartbeat observation = 1;
  uint32 recommended_interval_ms = 2;
  uint32 stale_after_ms = 3;
}

message GetHeartbeatRequest {
  string node_id = 1;
}

message GetHeartbeatResponse {
  NodeHeartbeat observation = 1;
  HeartbeatFreshness freshness = 2;
  uint64 age_ms = 3;
}

enum VolumeLifecycleState {
  VOLUME_LIFECYCLE_STATE_UNSPECIFIED = 0;
  VOLUME_LIFECYCLE_STATE_PROVISIONING = 1;
  VOLUME_LIFECYCLE_STATE_ACTIVE = 2;
  VOLUME_LIFECYCLE_STATE_DELETING = 3;
  VOLUME_LIFECYCLE_STATE_FAILED = 4;
}

enum VolumeAvailabilityState {
  VOLUME_AVAILABILITY_STATE_UNSPECIFIED = 0;
  VOLUME_AVAILABILITY_STATE_UNKNOWN = 1;
  VOLUME_AVAILABILITY_STATE_HEALTHY = 2;
  VOLUME_AVAILABILITY_STATE_DEGRADED = 3;
  VOLUME_AVAILABILITY_STATE_READ_ONLY = 4;
  VOLUME_AVAILABILITY_STATE_UNAVAILABLE = 5;
}

enum VolumeOperationPhase {
  VOLUME_OPERATION_PHASE_UNSPECIFIED = 0;
  VOLUME_OPERATION_PHASE_NONE = 1;
  VOLUME_OPERATION_PHASE_PLACING = 2;
  VOLUME_OPERATION_PHASE_FENCING = 3;
  VOLUME_OPERATION_PHASE_RECOVERING = 4;
  VOLUME_OPERATION_PHASE_REPAIRING = 5;
}

enum VolumeProtectionKind {
  VOLUME_PROTECTION_KIND_UNSPECIFIED = 0;
  VOLUME_PROTECTION_KIND_REPLICATED = 1;
}

message Volume {
  string id = 1;
  string pool_id = 2;
  string name = 3;
  string description = 4;
  uint64 size_bytes = 5;
  VolumeProtectionKind protection_kind = 6;
  uint32 target_replica_count = 7;
  uint32 write_quorum = 8;
  uint32 read_quorum = 9;
  VolumeLifecycleState lifecycle_state = 10;
  VolumeAvailabilityState availability_state = 11;
  VolumeOperationPhase operation_phase = 12;
  uint64 generation = 13;
  uint64 write_epoch = 14;
  uint64 placement_revision = 15;
  int64 created_at_unix_ms = 16;
  uint64 created_revision = 17;
  uint64 resource_version = 18;
}

message CreateVolumeRequest {
  string request_id = 1;
  string pool_id = 2;
  string name = 3;
  string description = 4;
  uint64 size_bytes = 5;
}

message CreateVolumeResponse {
  Volume volume = 1;
}

message GetVolumeRequest {
  string volume_id = 1;
}

message GetVolumeResponse {
  Volume volume = 1;
}

message UpdateVolumeRequest {
  string request_id = 1;
  string volume_id = 2;
  string description = 3;
  uint64 expected_resource_version = 4;
}

message UpdateVolumeResponse {
  Volume volume = 1;
}

message ListVolumesRequest {
  string pool_id = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
  bytes next_page_token = 2;
}

message DeleteVolumeRequest {
  string request_id = 1;
  string volume_id = 2;
  uint64 expected_resource_version = 3;
}

message DeleteVolumeResponse {
  string volume_id = 1;
  int64 accepted_at_unix_ms = 2;
  uint64 accepted_revision = 3;
  bool deletion_pending = 4;
  Volume volume = 5;
}

enum DataReplicaState {
  DATA_REPLICA_STATE_UNSPECIFIED = 0;
  DATA_REPLICA_STATE_ACTIVE = 1;
  DATA_REPLICA_STATE_TOMBSTONED = 2;
}

message ReplicaAttestation {
  string volume_id = 1;
  string placement_id = 2;
  string allocation_id = 3;
  uint64 generation = 4;
  bytes member_id = 5;
  uint64 offset_bytes = 6;
  uint64 length_bytes = 7;
  bytes backend_digest = 8;
}

message DataReplica {
  DataReplicaState state = 1;
  ReplicaAttestation attestation = 2;
}

message EnsureReplicaRequest {
  string operation_id = 1;
  string volume_id = 2;
  string placement_id = 3;
  string allocation_id = 4;
  uint64 generation = 5;
  bytes member_id = 6;
  uint64 offset_bytes = 7;
  uint64 length_bytes = 8;
}

message EnsureReplicaResponse {
  string operation_id = 1;
  DataReplica replica = 2;
}

message InspectReplicaRequest {
  string operation_id = 1;
  string volume_id = 2;
  string placement_id = 3;
  string allocation_id = 4;
  uint64 generation = 5;
  bytes member_id = 6;
  uint64 offset_bytes = 7;
  uint64 length_bytes = 8;
}

message InspectReplicaResponse {
  string operation_id = 1;
  DataReplica replica = 2;
}

message DeleteReplicaRequest {
  string operation_id = 1;
  string volume_id = 2;
  string placement_id = 3;
  string allocation_id = 4;
  uint64 generation = 5;
  bytes member_id = 6;
  uint64 offset_bytes = 7;
  uint64 length_bytes = 8;
}

message DeleteReplicaResponse {
  string operation_id = 1;
  DataReplica replica = 2;
}

// Node-local identities are canonical UUIDv7 values encoded as exactly 16 bytes.
// Digests are exactly 32 bytes. Servers must reject malformed bindings with
// INVALID_ARGUMENT, stale/conflicting authority with FAILED_PRECONDITION, missing
// local state with NOT_FOUND, and retryable transport/backend failure with
// UNAVAILABLE. Mutations are idempotent for an identical complete binding.
message DataAuthorityBinding {
  bytes volume_id = 1;
  bytes primary_placement_id = 2;
  bytes primary_node_id = 3;
  bytes lease_id = 4;
  bytes holder_boot_id = 5;
  uint64 authority_generation = 6;
  uint64 write_epoch = 7;
  uint64 placement_revision = 8;
  bytes activation_nonce = 9;
  bytes authority_digest = 10;
}

message IdentifyHolderRequest {}

message IdentifyHolderResponse {
  bytes holder_boot_id = 1;
}

message StagePrimaryRequest {
  DataAuthorityBinding binding = 1;
  uint32 lease_duration_ms = 2;
}

message StagePrimaryResponse {
  DataAuthorityBinding binding = 1;
  uint32 lease_duration_ms = 2;
}

message DataReplicaFenceBinding {
  bytes operation_id = 1;
  bytes volume_id = 2;
  bytes placement_id = 3;
  uint64 replica_generation = 4;
  uint64 write_epoch = 5;
  bytes primary_node_id = 6;
  bytes lease_id = 7;
  bytes authority_digest = 8;
}

message FenceReplicaRequest {
  DataReplicaFenceBinding binding = 1;
}

message FenceReplicaResponse {
  DataReplicaFenceBinding binding = 1;
  bytes fence_digest = 2;
}

message RecoverPrimaryRequest {
  DataAuthorityBinding binding = 1;
}

message RecoverPrimaryResponse {
  DataAuthorityBinding binding = 1;
  uint64 certified_sequence = 2;
  bytes history_digest = 3;
  bool empty_frontier = 4;
}

message MarkPrimaryReadyRequest {
  DataAuthorityBinding binding = 1;
}

message MarkPrimaryReadyResponse {
  DataAuthorityBinding binding = 1;
}

message InspectPrimaryRequest {
  DataAuthorityBinding binding = 1;
}

message InspectPrimaryResponse {
  DataAuthorityBinding binding = 1;
  bool current_active = 2;
  bool current_admitting = 3;
  bool candidate_fresh = 4;
  bool should_renew = 5;
}

enum ReplicaPlacementState {
  REPLICA_PLACEMENT_STATE_UNSPECIFIED = 0;
  REPLICA_PLACEMENT_STATE_RESERVED = 1;
  REPLICA_PLACEMENT_STATE_ACTIVE = 2;
  REPLICA_PLACEMENT_STATE_RETIRING = 3;
}

message ReplicaPlacement {
  string id = 1;
  string volume_id = 2;
  string node_id = 3;
  uint32 replica_index = 4;
  uint64 generation = 5;
  ReplicaPlacementState state = 6;
  uint64 created_revision = 7;
  uint64 resource_version = 8;
  bytes backend_digest = 9;
  uint64 attested_revision = 10;
}

enum ReplicaAllocationState {
  REPLICA_ALLOCATION_STATE_UNSPECIFIED = 0;
  REPLICA_ALLOCATION_STATE_RESERVED = 1;
  REPLICA_ALLOCATION_STATE_ACTIVE = 2;
  REPLICA_ALLOCATION_STATE_RETIRING = 3;
}

message ReplicaAllocation {
  string id = 1;
  string replica_id = 2;
  bytes member_id = 3;
  uint64 offset_bytes = 4;
  uint64 length_bytes = 5;
  uint64 generation = 6;
  ReplicaAllocationState state = 7;
  uint64 created_revision = 8;
  uint64 resource_version = 9;
}

enum VolumeAccessMode {
  VOLUME_ACCESS_MODE_UNSPECIFIED = 0;
  VOLUME_ACCESS_MODE_SINGLE_NODE_WRITER = 1;
  VOLUME_ACCESS_MODE_SINGLE_NODE_READER = 2;
}

enum VolumeAttachmentState {
  VOLUME_ATTACHMENT_STATE_UNSPECIFIED = 0;
  VOLUME_ATTACHMENT_STATE_ATTACHING = 1;
  VOLUME_ATTACHMENT_STATE_ATTACHED = 2;
  VOLUME_ATTACHMENT_STATE_DETACHING = 3;
  VOLUME_ATTACHMENT_STATE_FAILED = 4;
}

message VolumeAttachment {
  string id = 1;
  string volume_id = 2;
  string target_node_id = 3;
  string consumer_id = 4;
  VolumeAccessMode access_mode = 5;
  VolumeAttachmentState state = 6;
  uint64 generation = 7;
  uint64 created_revision = 8;
  uint64 resource_version = 9;
}

enum PrimaryAuthorityState {
  PRIMARY_AUTHORITY_STATE_UNSPECIFIED = 0;
  PRIMARY_AUTHORITY_STATE_PENDING = 1;
  PRIMARY_AUTHORITY_STATE_ACTIVATED = 2;
  PRIMARY_AUTHORITY_STATE_READY = 3;
}

message PrimaryAuthority {
  string volume_id = 1;
  string primary_placement_id = 2;
  string primary_node_id = 3;
  bytes lease_id = 4;
  bytes holder_boot_id = 5;
  uint64 authority_generation = 6;
  uint64 write_epoch = 7;
  uint64 placement_revision = 8;
  bytes activation_nonce = 9;
  uint32 lease_duration_ms = 10;
  PrimaryAuthorityState state = 11;
  bytes authority_digest = 12;
  uint64 created_revision = 13;
  uint64 activated_revision = 14;
  uint64 ready_revision = 15;
  uint64 resource_version = 16;
  uint64 recovery_sequence = 17;
  bytes recovery_digest = 18;
  bool recovery_empty_frontier = 19;
}

enum PrimaryFailoverState {
  PRIMARY_FAILOVER_STATE_UNSPECIFIED = 0;
  PRIMARY_FAILOVER_STATE_WAITING_LEASE = 1;
  PRIMARY_FAILOVER_STATE_LEASE_EXPIRED = 2;
  PRIMARY_FAILOVER_STATE_FENCING = 3;
}

message PrimaryFailover {
  bytes failover_id = 1;
  string volume_id = 2;
  bytes revoked_lease_id = 3;
  uint64 revoked_authority_generation = 4;
  uint64 revoked_write_epoch = 5;
  uint64 target_write_epoch = 6;
  PrimaryFailoverState state = 7;
  uint64 created_revision = 8;
  uint64 resource_version = 9;
}

message ReplicaFenceEvidence {
  string placement_id = 1;
  uint64 replica_generation = 2;
  uint64 write_epoch = 3;
  bytes lease_id = 4;
  bytes authority_digest = 5;
  bytes fence_digest = 6;
}

message RecoveryEvidence {
  string volume_id = 1;
  uint64 write_epoch = 2;
  uint64 certified_sequence = 3;
  bytes history_digest = 4;
  bool empty_frontier = 5;
}

message VolumeTombstone {
  Volume volume = 1;
  int64 deleted_at_unix_ms = 2;
  uint64 deleted_revision = 3;
}

message CommandEnvelope {
  uint32 format_version = 1;
  oneof command {
    CreatePoolCommand create_pool = 2;
    RegisterNodeCommand register_node = 3;
    RegisterMemberCommand register_member = 4;
    CreateVolumeCommand create_volume = 5;
    DeleteVolumeCommand delete_volume = 6;
    UpdateVolumeCommand update_volume = 7;
    ReserveVolumeResourcesCommand reserve_volume_resources = 8;
    ActivateReplicaCommand activate_replica = 9;
    FinalizeVolumeDeletionCommand finalize_volume_deletion = 10;
    ProposePrimaryAuthorityCommand propose_primary_authority = 11;
    ActivatePrimaryAuthorityCommand activate_primary_authority = 12;
    CommitPrimaryAuthorityReadyCommand commit_primary_authority_ready = 13;
    CommitPrimaryAuthorityRenewalReadyCommand commit_primary_authority_renewal_ready = 14;
    AbortPrimaryAuthorityCandidateCommand abort_primary_authority_candidate = 15;
    BeginPrimaryFailoverCommand begin_primary_failover = 16;
    CommitPrimaryAuthorityFailoverReadyCommand commit_primary_authority_failover_ready = 17;
    CompletePrimaryFailoverLeaseWaitCommand complete_primary_failover_lease_wait = 18;
  }
}

message CreatePoolCommand {
  string request_id = 1;
  string proposed_pool_id = 2;
  string name = 3;
  string description = 4;
  int64 proposed_created_at_unix_ms = 5;
}

message RegisterNodeCommand {
  string request_id = 1;
  string node_id = 2;
  bytes cluster_id = 3;
  string control_endpoint = 4;
  string nvmf_endpoint = 5;
  string failure_domain = 6;
  uint64 capability_bits = 7;
  uint32 protocol_version = 8;
  int64 proposed_registered_at_unix_ms = 9;
}

message RegisterMemberCommand {
  string request_id = 1;
  bytes cluster_id = 2;
  bytes member_id = 3;
  string pool_id = 4;
  string node_id = 5;
  bytes local_set_id = 6;
  uint32 member_slot = 7;
  bytes birth_topology_digest = 8;
  uint64 metadata_capacity_bytes = 9;
  uint64 data_capacity_bytes = 10;
  uint32 extent_size_bytes = 11;
  int64 proposed_registered_at_unix_ms = 12;
}

message CreateVolumeCommand {
  string request_id = 1;
  string proposed_volume_id = 2;
  string pool_id = 3;
  string name = 4;
  string description = 5;
  uint64 size_bytes = 6;
  int64 proposed_created_at_unix_ms = 7;
}

message DeleteVolumeCommand {
  string request_id = 1;
  string volume_id = 2;
  uint64 expected_resource_version = 3;
  int64 proposed_deleted_at_unix_ms = 4;
}

message UpdateVolumeCommand {
  string request_id = 1;
  string volume_id = 2;
  string description = 3;
  uint64 expected_resource_version = 4;
}

message ReplicaReservation {
  ReplicaPlacement placement = 1;
  ReplicaAllocation allocation = 2;
}

message ReserveVolumeResourcesCommand {
  string volume_id = 1;
  uint64 expected_resource_version = 2;
  repeated ReplicaReservation reservations = 3;
}

message ActivateReplicaCommand {
  string volume_id = 1;
  string placement_id = 2;
  string allocation_id = 3;
  uint64 expected_volume_resource_version = 4;
  uint64 expected_placement_resource_version = 5;
  uint64 expected_allocation_resource_version = 6;
  ReplicaAttestation attestation = 7;
}

message FinalizeVolumeDeletionCommand {
  string volume_id = 1;
  uint64 expected_resource_version = 2;
  repeated string placement_ids = 3;
  repeated string allocation_ids = 4;
  int64 proposed_deleted_at_unix_ms = 5;
}

message ProposePrimaryAuthorityCommand {
  PrimaryAuthority authority = 1;
  uint64 expected_volume_resource_version = 2;
  bytes failover_id = 3;
  uint64 expected_failover_resource_version = 4;
}

message ActivatePrimaryAuthorityCommand {
  string volume_id = 1;
  bytes lease_id = 2;
  bytes activation_nonce = 3;
  uint64 authority_generation = 4;
  uint64 write_epoch = 5;
  uint64 placement_revision = 6;
  uint64 expected_volume_resource_version = 7;
  uint64 expected_authority_resource_version = 8;
}

message CommitPrimaryAuthorityReadyCommand {
  string volume_id = 1;
  bytes lease_id = 2;
  bytes authority_digest = 3;
  uint64 authority_generation = 4;
  uint64 write_epoch = 5;
  uint64 placement_revision = 6;
  uint64 expected_volume_resource_version = 7;
  uint64 expected_authority_resource_version = 8;
  repeated ReplicaFenceEvidence fence_evidence = 9;
  RecoveryEvidence recovery_evidence = 10;
}

message CommitPrimaryAuthorityRenewalReadyCommand {
  string volume_id = 1;
  bytes lease_id = 2;
  uint64 authority_generation = 3;
  uint64 write_epoch = 4;
  uint64 placement_revision = 5;
  uint64 expected_volume_resource_version = 6;
  uint64 expected_candidate_resource_version = 7;
  uint64 expected_current_resource_version = 8;
}

message AbortPrimaryAuthorityCandidateCommand {
  string volume_id = 1;
  bytes lease_id = 2;
  uint64 authority_generation = 3;
  uint64 expected_volume_resource_version = 4;
  uint64 expected_candidate_resource_version = 5;
  uint64 expected_current_resource_version = 6;
}

message BeginPrimaryFailoverCommand {
  string volume_id = 1;
  bytes current_lease_id = 2;
  uint64 current_authority_generation = 3;
  uint64 current_write_epoch = 4;
  bytes failover_id = 5;
  uint64 expected_volume_resource_version = 6;
  uint64 expected_current_resource_version = 7;
}

message CompletePrimaryFailoverLeaseWaitCommand {
  string volume_id = 1;
  bytes failover_id = 2;
  bytes revoked_lease_id = 3;
  uint64 revoked_authority_generation = 4;
  uint64 revoked_write_epoch = 5;
  uint64 expected_volume_resource_version = 6;
  uint64 expected_failover_resource_version = 7;
  uint64 expected_current_resource_version = 8;
}

message CommitPrimaryAuthorityFailoverReadyCommand {
  string volume_id = 1;
  bytes failover_id = 2;
  bytes lease_id = 3;
  bytes authority_digest = 4;
  uint64 authority_generation = 5;
  uint64 write_epoch = 6;
  uint64 placement_revision = 7;
  uint64 expected_volume_resource_version = 8;
  uint64 expected_candidate_resource_version = 9;
  uint64 expected_current_resource_version = 10;
  uint64 expected_failover_resource_version = 11;
  repeated ReplicaFenceEvidence fence_evidence = 12;
  RecoveryEvidence recovery_evidence = 13;
}

enum ApplyCode {
  APPLY_CODE_UNSPECIFIED = 0;
  APPLY_CODE_CREATED = 1;
  reserved 2;
  APPLY_CODE_NAME_EXISTS = 3;
  APPLY_CODE_REQUEST_CONFLICT = 4;
  APPLY_CODE_ID_EXISTS = 5;
  APPLY_CODE_REQUEST_LIMIT = 6;
  APPLY_CODE_POOL_LIMIT = 7;
}

message ApplyResponse {
  ApplyCode code = 1;
  Pool pool = 2;
}

enum RegisterNodeApplyCode {
  REGISTER_NODE_APPLY_CODE_UNSPECIFIED = 0;
  REGISTER_NODE_APPLY_CODE_REGISTERED = 1;
  REGISTER_NODE_APPLY_CODE_REQUEST_CONFLICT = 2;
  REGISTER_NODE_APPLY_CODE_ID_EXISTS = 3;
  REGISTER_NODE_APPLY_CODE_REQUEST_LIMIT = 4;
  REGISTER_NODE_APPLY_CODE_NODE_LIMIT = 5;
}

message RegisterNodeApplyResponse {
  RegisterNodeApplyCode code = 1;
  Node node = 2;
}

enum RegisterMemberApplyCode {
  REGISTER_MEMBER_APPLY_CODE_UNSPECIFIED = 0;
  REGISTER_MEMBER_APPLY_CODE_REGISTERED = 1;
  REGISTER_MEMBER_APPLY_CODE_REQUEST_CONFLICT = 2;
