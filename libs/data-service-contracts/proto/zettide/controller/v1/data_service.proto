syntax = "proto3";

package zettide.controller.v1;

service DataService {
  rpc EnsureReplica(EnsureReplicaRequest) returns (EnsureReplicaResponse);
  rpc InspectReplica(InspectReplicaRequest) returns (InspectReplicaResponse);
  rpc DeleteReplica(DeleteReplicaRequest) returns (DeleteReplicaResponse);
  rpc ConfigureWriteParticipant(ConfigureWriteParticipantRequest) returns (ConfigureWriteParticipantResponse);
  rpc IdentifyHolder(IdentifyHolderRequest) returns (IdentifyHolderResponse);
  rpc StagePrimary(StagePrimaryRequest) returns (StagePrimaryResponse);
  rpc FenceReplica(FenceReplicaRequest) returns (FenceReplicaResponse);
  rpc RecoverPrimary(RecoverPrimaryRequest) returns (RecoverPrimaryResponse);
  rpc MarkPrimaryReady(MarkPrimaryReadyRequest) returns (MarkPrimaryReadyResponse);
  rpc InspectPrimary(InspectPrimaryRequest) returns (InspectPrimaryResponse);
  rpc ConfigureWriteCoordinator(ConfigureWriteCoordinatorRequest) returns (ConfigureWriteCoordinatorResponse);
}

// Internal payload-bearing Replica protocol. Implementations must expose this
// service on a listener separate from DataService and authenticate every call.
// Authentication metadata is outside protobuf so its MAC covers the exact
// serialized request bytes and full method path.
service ReplicaTransport {
  rpc Prepare(ReplicaPrepareRequest) returns (ReplicaPrepareResponse);
  rpc Commit(ReplicaCommitRequest) returns (ReplicaCommitResponse);
  rpc Inspect(ReplicaWriteInspectRequest) returns (ReplicaWriteInspectResponse);
  rpc ArmCoordinator(ReplicaArmCoordinatorRequest) returns (ReplicaArmCoordinatorResponse);
}

enum DataReplicaState {
  DATA_REPLICA_STATE_UNSPECIFIED = 0;
  DATA_REPLICA_STATE_ACTIVE = 1;
  DATA_REPLICA_STATE_TOMBSTONED = 2;
}

message DataReplicaAttestation {
  string volume_id = 1;
  string placement_id = 2;
  string allocation_id = 3;
  uint64 generation = 4;
  bytes member_id = 5;
  uint64 offset_bytes = 6;
  uint64 length_bytes = 7;
  bytes backend_digest = 8;
}

message DataReplica {
  DataReplicaState state = 1;
  DataReplicaAttestation attestation = 2;
}

message EnsureReplicaRequest {
  string operation_id = 1;
  string volume_id = 2;
  string placement_id = 3;
  string allocation_id = 4;
  uint64 generation = 5;
  bytes member_id = 6;
  uint64 offset_bytes = 7;
  uint64 length_bytes = 8;
}

message EnsureReplicaResponse {
  string operation_id = 1;
  DataReplica replica = 2;
}

message InspectReplicaRequest {
  string operation_id = 1;
  string volume_id = 2;
  string placement_id = 3;
  string allocation_id = 4;
  uint64 generation = 5;
  bytes member_id = 6;
  uint64 offset_bytes = 7;
  uint64 length_bytes = 8;
}

message InspectReplicaResponse {
  string operation_id = 1;
  DataReplica replica = 2;
}

message DeleteReplicaRequest {
  string operation_id = 1;
  string volume_id = 2;
  string placement_id = 3;
  string allocation_id = 4;
  uint64 generation = 5;
  bytes member_id = 6;
  uint64 offset_bytes = 7;
  uint64 length_bytes = 8;
}

message DeleteReplicaResponse {
  string operation_id = 1;
  DataReplica replica = 2;
}

// Controller-pinned generation-1 Ed25519 witness identity.
message DataWitnessIdentity {
  bytes member_id = 1;
  bytes node_id = 2;
  bytes key_id = 3;
  bytes public_key = 4;
}

// Controller-provisioned immutable node-local participant identity. The
// repeated Member list contains exactly three distinct IDs in bytewise order.
message DataWriteParticipantBinding {
  bytes volume_id = 1;
  bytes placement_id = 2;
  bytes allocation_id = 3;
  uint64 generation = 4;
  bytes member_id = 5;
  uint64 offset_bytes = 6;
  uint64 length_bytes = 7;
  bytes backend_digest = 8;
  repeated bytes replica_member_ids = 9;
  repeated DataWitnessIdentity witness_identities = 10;
}

message ConfigureWriteParticipantRequest {
  DataWriteParticipantBinding binding = 1;
}

message ConfigureWriteParticipantResponse {
  DataWriteParticipantBinding binding = 1;
}

message DataWriteRequest {
  DataAuthorityBinding authority = 1;
  repeated bytes replica_member_ids = 2;
  uint64 sequence = 3;
  bytes transaction_id = 4;
  bytes previous_history_digest = 5;
  uint64 offset_bytes = 6;
  uint64 length_bytes = 7;
  bytes data_digest = 8;
}

message DataPrepareAttestation {
  bytes member_id = 1;
  bytes transaction_digest = 2;
  bytes prepare_digest = 3;
  bytes prepared_history_digest = 4;
}

message ReplicaPrepareRequest {
  DataWriteParticipantBinding binding = 1;
  DataWriteRequest write = 2;
  bytes data = 3;
}

message DataSignedPrepareEvidence {
  DataPrepareAttestation attestation = 1;
  bytes signer_node_id = 2;
  bytes key_id = 3;
  bytes signature = 4;
}

message DataSignedCommitCertificate {
  repeated DataSignedPrepareEvidence prepare_evidence = 1;
}

message DataCommitResult {
  bytes transaction_id = 1;
  uint64 sequence = 2;
  bytes history_digest = 3;
}

message DataSignedCommitEvidence {
  bytes member_id = 1;
  bytes signer_node_id = 2;
  bytes key_id = 3;
  DataCommitResult result = 4;
  bytes signature = 5;
}

message ReplicaPrepareResponse {
  // Field 1 is retained only for append-only wire compatibility. Signed
  // transports never populate it and clients reject unsigned responses.
  DataPrepareAttestation attestation = 1;
  DataSignedPrepareEvidence signed_evidence = 2;
}

message ReplicaCommitRequest {
  DataWriteParticipantBinding binding = 1;
  DataAuthorityBinding authority = 2;
  bytes transaction_id = 3;
  // Field 4 is the retired unsigned certificate and must remain empty.
  repeated DataPrepareAttestation attestations = 4;
  uint64 sequence = 5;
  DataSignedCommitCertificate signed_certificate = 6;
}

message ReplicaCommitResponse {
  bytes transaction_id = 1;
  uint64 sequence = 2;
  bytes history_digest = 3;
  DataSignedCommitEvidence signed_evidence = 4;
}

message ReplicaWriteInspectRequest {
  DataWriteParticipantBinding binding = 1;
  DataAuthorityBinding authority = 2;
}

message DataPendingWrite {
  DataWriteRequest write = 1;
  DataPrepareAttestation attestation = 2;
  bool commit_decided = 3;
}

message ReplicaWriteInspectResponse {
  uint64 frontier_sequence = 1;
  bytes frontier_history_digest = 2;
  DataPendingWrite pending = 3;
  ReplicaCommitResponse last_completed = 4;
}

// Node-local identities are canonical UUIDv7 values encoded as exactly 16 bytes.
// Digests are exactly 32 bytes. Mutations are idempotent for an identical binding.
message DataAuthorityBinding {
  bytes volume_id = 1;
  bytes primary_placement_id = 2;
  bytes primary_node_id = 3;
  bytes lease_id = 4;
  bytes holder_boot_id = 5;
  uint64 authority_generation = 6;
  uint64 write_epoch = 7;
  uint64 placement_revision = 8;
  bytes activation_nonce = 9;
  bytes authority_digest = 10;
}

message IdentifyHolderRequest {}
message IdentifyHolderResponse { bytes holder_boot_id = 1; }

message StagePrimaryRequest {
  DataAuthorityBinding binding = 1;
  uint32 lease_duration_ms = 2;
  bytes target_boot_id = 3;
}

message StagePrimaryResponse {
  DataAuthorityBinding binding = 1;
  uint32 lease_duration_ms = 2;
  bytes target_boot_id = 3;
}

message DataReplicaFenceBinding {
  bytes operation_id = 1;
  bytes volume_id = 2;
  bytes placement_id = 3;
  uint64 replica_generation = 4;
  uint64 write_epoch = 5;
  bytes primary_node_id = 6;
  bytes lease_id = 7;
  bytes authority_digest = 8;
}

message FenceReplicaRequest { DataReplicaFenceBinding binding = 1; }
message FenceReplicaResponse {
  DataReplicaFenceBinding binding = 1;
  bytes fence_digest = 2;
}

message RecoverPrimaryRequest { DataAuthorityBinding binding = 1; }
message RecoverPrimaryResponse {
  DataAuthorityBinding binding = 1;
  uint64 certified_sequence = 2;
  bytes history_digest = 3;
  bool empty_frontier = 4;
}

message MarkPrimaryReadyRequest {
  DataAuthorityBinding binding = 1;
  bytes target_boot_id = 2;
}
message MarkPrimaryReadyResponse {
  DataAuthorityBinding binding = 1;
  bytes target_boot_id = 2;
}
message InspectPrimaryRequest { DataAuthorityBinding binding = 1; }
message InspectPrimaryResponse {
  DataAuthorityBinding binding = 1;
  bool current_active = 2;
  bool current_admitting = 3;
  bool candidate_fresh = 4;
  bool should_renew = 5;
}

// Metadata-only routing configuration. Endpoints are operational routing data
// and are intentionally excluded from the cryptographic participant binding.
message DataWriteCoordinatorRoute {
  DataWriteParticipantBinding binding = 1;
  bytes node_id = 2;
  string replica_endpoint = 3;
}

message DataWriteCoordinatorTopology {
  bytes local_member_id = 1;
  repeated DataWriteCoordinatorRoute routes = 2;
}

message ConfigureWriteCoordinatorRequest {
  DataWriteCoordinatorTopology topology = 1;
}

message ConfigureWriteCoordinatorResponse {
  DataWriteCoordinatorTopology topology = 1;
}

// Metadata-only, authenticated arm barrier. Every topology member must durably
// acknowledge this exact coordinator generation before any write intent exists.
message ReplicaArmCoordinatorRequest {
  bytes placement_id = 1;
  uint64 generation = 2;
  DataAuthorityBinding authority = 3;
}

message ReplicaArmCoordinatorResponse {
  bytes placement_id = 1;
  uint64 generation = 2;
}
