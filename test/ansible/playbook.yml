---
- name: Run the Zettide Tier 1 suite on remote Linux hosts
  hosts: zettide_test
  gather_facts: true
  become: true

  vars:
    zettide_controller_root: "{{ playbook_dir }}/../.."
    zettide_test_profile: "{{ zettide_test_profile_override | default('tier1') }}"
    zettide_optimize_modes: "{{ zettide_optimize_modes_override | default(['Debug', 'ReleaseSafe']) }}"
    zettide_zig: zig
    zettide_zig_version: 0.16.0
    zettide_results_root: "{{ zettide_controller_root }}/test-results/ansible"
    zettide_keep_remote_workspace: false
    zettide_keep_test_artifacts: false
    zettide_io_timeout: 5400
    zettide_io_minimum_free_bytes: 4294967296
    zettide_throughput_redo_journal_size: ""
    zettide_blob_device_size: 17179869184
    zettide_blob_device_block_size: 1048576
    zettide_blob_device_batch_depth: 32
    zettide_blob_device_file_io: posix
    zettide_raw_timeout: 86400
    zettide_raw_test_mebibytes: 64
    zettide_raw_keep_backup: true
    zettide_raw_restore_original: true
    zettide_raw_fio: false
    zettide_raw_fio_size: 64G
    zettide_raw_fio_runtime: 20
    zettide_raw_fio_ramp_time: 5
    zettide_raw_fuse_fio: false
    zettide_raw_fuse_fio_single_size: 2G
    zettide_raw_fuse_fio_multi_size: 512M
    zettide_raw_fuse_fio_runtime: 20
    zettide_raw_fuse_fio_ramp_time: 5
    zettide_pool_fio_single_size: 2G
    zettide_pool_fio_multi_size: 512M
    zettide_pool_fio_runtime: 20
    zettide_pool_fio_ramp_time: 5
    zettide_nfs_nconnect: 1
    zettide_nfs_rpc_ioq_thrd_min: 2
    zettide_nfs_rpc_ioq_thrd_max: 16
    zettide_nfs_perf_case: ""
    zettide_nfs_perf_frequency: 199
    zettide_nvmf_fio_runtime: 20
    zettide_nvmf_fio_ramp_time: 5
    zettide_blob_fuse_fio_backing_size_effective: "{{ zettide_blob_fuse_fio_backing_size | default(34359738368) }}"
    zettide_blob_fuse_fio_file_size_effective: "{{ zettide_blob_fuse_fio_file_size | default(268435456) }}"
    zettide_blob_fuse_fio_runtime_effective: "{{ zettide_blob_fuse_fio_runtime | default(8) }}"
    zettide_blob_fuse_fio_ramp_time_effective: "{{ zettide_blob_fuse_fio_ramp_time | default(2) }}"
    zettide_blob_fuse_fio_timeout_effective: "{{ zettide_blob_fuse_fio_timeout | default(3600) }}"
    zettide_blob_workloads:
      - name: iops-4k
        size: 17179869184
        block_size: 4096
        batch_depth: 1
        file_io: posix
      - name: iops-4k-batch32
        size: 17179869184
        block_size: 4096
        batch_depth: 32
        file_io: posix
      - name: iops-4k-uring32
        size: 17179869184
        block_size: 4096
        batch_depth: 32
        file_io: io_uring
      - name: bw-256k
        size: 17179869184
        block_size: 262144
        batch_depth: 1
        file_io: posix
      - name: bw-1m
        size: 17179869184
        block_size: 1048576
        batch_depth: 1
        file_io: posix
    zettide_blob_benchmark_name: >-
      {{ 'blob-object' if zettide_test_profile == 'blob-object'
         else ('blob-store' if zettide_test_profile == 'blob-store' else 'blob-device') }}
    zettide_profile_tasks:
      tier1: tasks/run-mode.yml
      io-verify: tasks/run-io-verify.yml
      throughput: tasks/run-io-verify.yml
      blob-device: tasks/run-blob-device.yml
      blob-workload: tasks/run-blob-device.yml
      blob-store: tasks/run-blob-device.yml
      blob-object: tasks/run-blob-device.yml
      raw-device: tasks/run-raw-device.yml
      pool-fio: tasks/run-pool-fio.yml
      blob-fuse-fio: tasks/run-blob-fuse-fio.yml
      blob-pool-fio: tasks/run-blob-pool-fio.yml
      blob-pool-nfs-fio: tasks/run-blob-pool-fio.yml
      nvmf-fio: tasks/run-nvmf-fio.yml
    zettide_packages:
      RedHat:
        - acl
        - attr
        - autoconf
        - automake
        - bc
        - dbench
        - dump
        - e2fsprogs
        - fio
        - fuse3
        - fuse3-devel
        - gawk
        - gcc
        - git
        - indent
        - kernel-headers
        - libacl-devel
        - libaio-devel
        - libattr-devel
        - libcap-devel
        - libtool
        - liburing-devel
        - libuuid-devel
        - make
        - openssl
        - perl
        - perl-Test-Harness
        - pkgconf-pkg-config
        - psmisc
        - quota
        - sqlite
        - sudo
        - util-linux
        - xfsprogs
        - xfsprogs-devel
      Debian:
        - acl
        - attr
        - autoconf
        - automake
        - bc
        - build-essential
        - dbench
        - dump
        - e2fsprogs
        - fio
        - fuse3
        - gawk
        - git
        - indent
        - libacl1-dev
        - libaio-dev
        - libattr1-dev
        - libcap-dev
        - libfuse3-dev
        - libtest-harness-perl
        - libtool
        - libtool-bin
        - liburing-dev
        - linux-headers-{{ ansible_kernel }}
        - openssl
        - perl
        - psmisc
        - quota
        - sqlite3
        - sudo
        - uuid-dev
        - uuid-runtime
        - xfsprogs
        - xfslibs-dev
    zettide_io_packages:
      RedHat:
        - fio
        - fuse3
        - fuse3-devel
        - gcc
        - git
        - jq
        - kmod
        - perf
        - pkgconf-pkg-config
        - psmisc
        - sysstat
        - util-linux
      Debian:
        - build-essential
        - fio
        - fuse3
        - git
        - jq
        - kmod
        - libfuse3-dev
        - pkg-config
        - psmisc
        - sysstat
        - util-linux
    zettide_nfs_ganesha_packages:
      RedHat:
        - bison
        - cmake
        - dbus-devel
        - flex
        - gcc-c++
        - libacl-devel
        - libblkid-devel
        - libcap-devel
        - libunwind-devel
        - libuuid-devel
        - ninja-build
        - nfs-utils
        - openssl-devel
        - userspace-rcu-devel
      Debian:
        - bison
        - cmake
        - flex
        - libacl1-dev
        - libblkid-dev
        - libcap-dev
        - libdbus-1-dev
        - libunwind-dev
        - liburcu-dev
        - ninja-build
        - nfs-common
        - libssl-dev
        - uuid-dev
    zettide_nvmf_packages:
      RedHat:
        - autoconf
        - automake
        - elfutils-libelf-devel
        - fio
        - gcc
        - gcc-c++
        - jq
        - kmod
        - libtool
        - libuuid-devel
        - make
        - meson
        - nasm
        - ninja-build
        - numactl-devel
        - nvme-cli
        - openssl-devel
        - pkgconf-pkg-config
        - python3-pyelftools
      Debian:
        - autoconf
        - automake
        - build-essential
        - fio
        - jq
        - kmod
        - libelf-dev
        - libtool
        - libnuma-dev
        - libssl-dev
        - meson
        - nasm
        - ninja-build
        - nvme-cli
        - pkg-config
        - python3-pyelftools
        - uuid-dev

  pre_tasks:
    - name: Read the source revision
      ansible.builtin.command:
        argv:
          - git
          - rev-parse
          - HEAD
      args:
        chdir: "{{ zettide_controller_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: zettide_source_revision

    - name: Read the source working tree status
      ansible.builtin.command:
        argv:
          - git
          - status
          - --short
      args:
        chdir: "{{ zettide_controller_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: zettide_source_status

    - name: Create the controller staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: zettide-ansible-
      delegate_to: localhost
      become: false
      run_once: true
      register: zettide_controller_staging

    - name: Archive the current controller working tree
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=.git
          - --exclude=.venv
          - --exclude=.zig-cache
          - --exclude=zig-out
          - --exclude=test/external/.prepared
          - --exclude=test-results
          - --exclude=test/ansible/inventory.ini
          - -C
          - "{{ zettide_controller_root }}"
          - -czf
          - "{{ zettide_controller_staging.path }}/source.tar.gz"
          - .
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Hash the staged source archive
      ansible.builtin.stat:
        path: "{{ zettide_controller_staging.path }}/source.tar.gz"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      run_once: true
      register: zettide_source_archive

    - name: Archive the pinned SPDK source
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=.git
          - --exclude=build
          - --exclude=build-tmp
          - -C
          - "{{ zettide_controller_root }}/../third_party"
          - -czf
          - "{{ zettide_controller_staging.path }}/spdk-source.tar.gz"
          - spdk
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true
      when: zettide_test_profile == 'nvmf-fio'

    - name: Require a supported target family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in zettide_packages
        fail_msg: "Supported target families are RedHat and Debian."

    - name: Require a supported test profile
      ansible.builtin.assert:
        that:
          - zettide_test_profile in zettide_profile_tasks
        fail_msg: "Supported profiles include tier1, io-verify, throughput, blob profiles, Blob fio profiles, raw-device, and pool-fio."

  tasks:
    - name: Create the remote workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: zettide-test-
      register: zettide_remote_workspace

    - name: Create the remote result directory
      ansible.builtin.file:
        path: "{{ zettide_remote_workspace.path }}/test-results"
        state: directory
        mode: "0755"

    - name: Run the remote test lifecycle
      block:
        - name: Install test dependencies
          ansible.builtin.package:
            name: >-
              {{ zettide_packages[ansible_facts.os_family]
                 if zettide_test_profile == 'tier1'
                 else (zettide_nvmf_packages[ansible_facts.os_family]
                       if zettide_test_profile == 'nvmf-fio'
                       else zettide_io_packages[ansible_facts.os_family])
                      + (zettide_nfs_ganesha_packages[ansible_facts.os_family]
                         if zettide_test_profile == 'blob-pool-nfs-fio' else []) }}
            state: present

        - name: Load FUSE and loop device modules
          ansible.builtin.command:
            argv:
              - modprobe
              - "{{ item }}"
          loop: >-
            {{ ['nvme', 'nvme-tcp'] if zettide_test_profile == 'nvmf-fio'
               else (['fuse'] if zettide_test_profile in ['blob-fuse-fio', 'blob-pool-fio']
               else ['fuse', 'loop']) }}
          changed_when: false
          when: zettide_test_profile != 'blob-pool-nfs-fio'

        - name: Check the FUSE device
          ansible.builtin.stat:
            path: /dev/fuse
          register: zettide_fuse_device
          when: zettide_test_profile not in ['blob-pool-nfs-fio', 'nvmf-fio']

        - name: Require the FUSE device
          ansible.builtin.assert:
            that:
              - zettide_fuse_device.stat.exists
              - zettide_fuse_device.stat.ischr
            fail_msg: "/dev/fuse is unavailable on the remote test host."
          when: zettide_test_profile not in ['blob-pool-nfs-fio', 'nvmf-fio']

        - name: Check the remote Zig version
          ansible.builtin.command:
            argv:
              - "{{ zettide_zig }}"
              - version
          changed_when: false
          register: zettide_remote_zig

        - name: Require the pinned Zig version
          ansible.builtin.assert:
            that:
              - zettide_remote_zig.stdout == zettide_zig_version
            fail_msg: "Remote Zig must be {{ zettide_zig_version }}, found {{ zettide_remote_zig.stdout }}."

        - name: Read the remote fio version
          ansible.builtin.command:
            argv:
              - fio
              - --version
          changed_when: false
          register: zettide_remote_fio
          when: zettide_test_profile != 'tier1'

        - name: Extract the current working tree
          ansible.builtin.unarchive:
            src: "{{ zettide_controller_staging.path }}/source.tar.gz"
            dest: "{{ zettide_remote_workspace.path }}"

        - name: Record the test manifest
          ansible.builtin.copy:
            content: "{{ zettide_test_manifest | to_nice_json }}\n"
            dest: "{{ zettide_remote_workspace.path }}/test-results/manifest.json"
            mode: "0644"
          vars:
            zettide_test_manifest:
              profile: "{{ zettide_test_profile }}"
              optimize_modes: "{{ zettide_optimize_modes }}"
              inventory_host: "{{ inventory_hostname }}"
              remote_host: "{{ ansible_host | default(inventory_hostname) }}"
              distribution: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
              architecture: "{{ ansible_facts.architecture }}"
              kernel: "{{ ansible_facts.kernel }}"
              source_revision: "{{ zettide_source_revision.stdout }}"
              source_status: "{{ zettide_source_status.stdout_lines }}"
              source_archive_sha256: "{{ zettide_source_archive.stat.checksum }}"
              zig_version: "{{ zettide_remote_zig.stdout }}"
              fio_version: "{{ zettide_remote_fio.stdout | default('not-recorded') }}"
              io_targets: "{{ zettide_io_targets | default([]) }}"
              throughput_targets: "{{ zettide_throughput_targets | default([]) }}"
              blob_device_targets: "{{ zettide_blob_device_targets | default([]) }}"
              blob_fuse_targets: "{{ zettide_blob_fuse_targets | default([]) }}"
              pool_fio_frontend: >-
                {{ 'nfs' if zettide_test_profile == 'blob-pool-nfs-fio'
                   else ('nvmf' if zettide_test_profile == 'nvmf-fio' else 'fuse') }}
              blob_fuse_fio:
                backing_size: "{{ zettide_blob_fuse_fio_backing_size_effective }}"
                file_size: "{{ zettide_blob_fuse_fio_file_size_effective }}"
                runtime: "{{ zettide_blob_fuse_fio_runtime_effective }}"
                ramp_time: "{{ zettide_blob_fuse_fio_ramp_time_effective }}"
                timeout: "{{ zettide_blob_fuse_fio_timeout_effective }}"
              raw_device: >-
                {{ {} if zettide_test_profile == 'blob-fuse-fio'
                   else zettide_raw_device | default({}) }}
              started_utc: "{{ ansible_facts['date_time']['iso8601'] }}"

        - name: Prepare pinned external suites
          ansible.builtin.command:
            argv:
              - bash
              - test/external/prepare.sh
          args:
            chdir: "{{ zettide_remote_workspace.path }}"
          environment:
            ZETTIDE_PREPARE_JOBS: "{{ ansible_facts.processor_vcpus | default(2) }}"
          changed_when: true
          failed_when: false
          register: zettide_prepare
          when: zettide_test_profile == 'tier1'

        - name: Record external suite preparation
          ansible.builtin.copy:
            content: |-
              rc={{ zettide_prepare.rc }}
              {{ zettide_prepare.stdout }}
              {{ zettide_prepare.stderr }}
            dest: "{{ zettide_remote_workspace.path }}/test-results/prepare.log"
            mode: "0644"
          when: zettide_test_profile == 'tier1'

        - name: Require prepared external suites
          ansible.builtin.assert:
            that:
              - zettide_prepare.rc == 0
            fail_msg: "Pinned external suite preparation failed; inspect prepare.log."
          when: zettide_test_profile == 'tier1'

        - name: Run each optimization mode
          ansible.builtin.include_tasks:
            file: "{{ zettide_profile_tasks[zettide_test_profile] }}"
          loop: "{{ zettide_optimize_modes }}"
          loop_control:
            loop_var: zettide_optimize

      always:
        - name: Archive remote test results
          ansible.builtin.command:
            argv:
              - tar
              - -C
              - "{{ zettide_remote_workspace.path }}"
              - -czf
              - "{{ zettide_remote_workspace.path }}/results.tar.gz"
              - test-results
          changed_when: true
          failed_when: false
          register: zettide_archive_results

        - name: Fetch remote test results
          ansible.builtin.fetch:
            src: "{{ zettide_remote_workspace.path }}/results.tar.gz"
            dest: "{{ zettide_results_root }}/{{ inventory_hostname }}-{{ ansible_facts['date_time']['iso8601_basic_short'] }}-{{ zettide_source_revision.stdout[:12] }}.tar.gz"
            flat: true
          register: zettide_fetch_results
          when: zettide_archive_results.rc == 0

        - name: Remove the remote workspace
          ansible.builtin.file:
            path: "{{ zettide_remote_workspace.path }}"
            state: absent
          when:
            - not zettide_keep_remote_workspace | bool
            - zettide_archive_results.rc == 0
            - not (zettide_fetch_results.failed | default(true))

        - name: Remove the controller staging directory
          ansible.builtin.file:
            path: "{{ zettide_controller_staging.path }}"
            state: absent
          delegate_to: localhost
          become: false
          run_once: true

        - name: Require archived and fetched test results
          ansible.builtin.assert:
            that:
              - zettide_archive_results.rc == 0
              - not (zettide_fetch_results.skipped | default(false))
              - not (zettide_fetch_results.failed | default(true))
            fail_msg: >-
              Remote test results were not archived and fetched. The remote
              workspace was retained when possible.
