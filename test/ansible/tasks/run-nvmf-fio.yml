---
- name: Extract SPDK source | {{ zettide_optimize }}
  ansible.builtin.unarchive:
    src: "{{ zettide_controller_staging.path }}/spdk-source.tar.gz"
    dest: "{{ zettide_remote_workspace.path }}"

- name: Configure SPDK for NVMe-oF/TCP | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - ./configure
      - --with-shared
      - --without-rdma
      - --without-uring
      - --disable-tests
      - --disable-unit-tests
      - --disable-examples
      - --disable-apps
      - --without-nvme-cuse
      - --without-fsdev
  args:
    chdir: "{{ zettide_remote_workspace.path }}/spdk"
  changed_when: true

- name: Build SPDK for NVMe-oF/TCP | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - make
      - "-j{{ ansible_facts.processor_vcpus | default(2) }}"
  args:
    chdir: "{{ zettide_remote_workspace.path }}/spdk"
  changed_when: true

- name: Build the NVMe-oF benchmark target | {{ zettide_optimize }}
  ansible.builtin.shell:
    cmd: >-
      cc -O3 -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Wno-unused-parameter
      -Isrc -Itest src/spdk/runtime.c src/spdk/bdev_provider.c
      src/spdk/nvmf_tcp_export.c test/spdk_runtime.c test/spdk_nvmf_benchmark.c
      -o test/spdk-nvmf-benchmark -pthread -Wl,--no-as-needed
      $(PKG_CONFIG_PATH=./spdk/build/lib/pkgconfig pkg-config --cflags --libs
      spdk_event spdk_event_bdev spdk_vhost spdk_event_nvmf spdk_bdev_modules spdk_env_dpdk
      spdk_nvmf spdk_sock_modules spdk_syslibs) -Wl,--as-needed
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  changed_when: true
  when: zettide_test_profile == 'nvmf-fio'

- name: Build the Catalog NVMe-oF benchmark target | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - zig
      - build
      - -Dspdk=true
      - "-Doptimize={{ zettide_optimize }}"
      - build-nvmf-catalog-benchmark
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    PKG_CONFIG_PATH: "{{ zettide_remote_workspace.path }}/spdk/build/lib/pkgconfig"
  changed_when: true
  when: zettide_test_profile == 'nvmf-catalog-fio'

- name: Link the Catalog NVMe-oF benchmark target | {{ zettide_optimize }}
  ansible.builtin.shell:
    cmd: >-
      cc -O3 -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Wno-unused-parameter
      -Isrc -Itest src/spdk/runtime.c src/spdk/bdev_provider.c
      src/spdk/nvmf_tcp_export.c test/spdk_runtime.c test/spdk_catalog_nvmf_benchmark_main.c
      zig-out/lib/libzettide-spdk-catalog-nvmf-benchmark.a
      -o test/spdk-catalog-nvmf-benchmark -pthread -lubsan -lstdc++ -Wl,--no-as-needed
      $(PKG_CONFIG_PATH=./spdk/build/lib/pkgconfig pkg-config --cflags --libs
      spdk_event spdk_event_bdev spdk_vhost spdk_event_nvmf spdk_bdev_modules spdk_env_dpdk
      spdk_nvmf spdk_sock_modules spdk_syslibs) -Wl,--as-needed
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  changed_when: true
  when: zettide_test_profile == 'nvmf-catalog-fio'

- name: Discover SPDK shared library paths | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - pkg-config
      - --libs-only-L
      - spdk_event
      - spdk_event_bdev
      - spdk_vhost
      - spdk_event_nvmf
      - spdk_bdev_modules
      - spdk_env_dpdk
      - spdk_nvmf
      - spdk_sock_modules
      - spdk_syslibs
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    PKG_CONFIG_PATH: "{{ zettide_remote_workspace.path }}/spdk/build/lib/pkgconfig"
  changed_when: false
  register: zettide_spdk_library_flags

- name: Run NVMe-oF/TCP fio | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - bash
      - test/spdk-nvmf-fio.sh
      - >-
        {{ zettide_remote_workspace.path ~
           ('/test/spdk-catalog-nvmf-benchmark'
            if zettide_test_profile == 'nvmf-catalog-fio'
            else '/test/spdk-nvmf-benchmark') }}
      - "{{ zettide_remote_workspace.path }}/nvmf-ready"
      - "{{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/{{ zettide_test_profile }}"
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    LD_LIBRARY_PATH: >-
      {{ zettide_spdk_library_flags.stdout.split()
         | map('regex_replace', '^-L', '') | join(':') }}
    ZETTIDE_NVMF_FIO_RUNTIME: "{{ zettide_nvmf_fio_runtime }}"
    ZETTIDE_NVMF_FIO_RAMP_TIME: "{{ zettide_nvmf_fio_ramp_time }}"
    ZETTIDE_NVMF_TARGET_ARGUMENT: >-
      {{ zettide_remote_workspace.path ~ '/catalog-member'
         if zettide_test_profile == 'nvmf-catalog-fio' else '' }}
  changed_when: true
  failed_when: false
  register: zettide_nvmf_fio_result

- name: Record NVMe-oF/TCP fio lifecycle | {{ zettide_optimize }}
  ansible.builtin.copy:
    content: |-
      rc={{ zettide_nvmf_fio_result.rc | default(1) }}
      {{ zettide_nvmf_fio_result.stdout | default('') }}
      {{ zettide_nvmf_fio_result.stderr | default(zettide_nvmf_fio_result.msg | default('')) }}
    dest: "{{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/{{ zettide_test_profile }}/ansible.log"
    mode: "0644"

- name: Require NVMe-oF/TCP fio lifecycle | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_nvmf_fio_result.rc | default(1) == 0
    fail_msg: "NVMe-oF/TCP fio failed; inspect the fetched {{ zettide_test_profile }} logs."
