---
- name: Initialize scheduled Pool vhost configuration | {{ zettide_optimize }}
  ansible.builtin.set_fact:
    zettide_scheduled_pool_vhost_config: "{{ zettide_raw_device | default({}) }}"
    zettide_scheduled_pool_result_name: "{{ zettide_test_profile }}"
    zettide_scheduled_pool_direct_perf: "{{ zettide_test_profile == 'spdk-nvme-perf' }}"
    zettide_scheduled_pool_raw_vhost: "{{ zettide_test_profile == 'vhost-spdk-nvme-fio' }}"
    zettide_scheduled_pool_synthetic: >-
      {{ zettide_vhost_scheduled_pool_storage_transport | default('linux') == 'synthetic' }}
    zettide_scheduled_pool_cpu_profile: >-
      {{ zettide_vhost_scheduled_pool_cpu_profile_case | default('') | length > 0 }}

- name: Validate scheduled Pool vhost configuration | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_scheduled_pool_vhost_config is mapping
      - zettide_scheduled_pool_synthetic or zettide_scheduled_pool_vhost_config.path is defined
      - zettide_scheduled_pool_synthetic or zettide_scheduled_pool_vhost_config.serial is defined
      - zettide_scheduled_pool_synthetic or zettide_scheduled_pool_vhost_config.path is string
      - zettide_scheduled_pool_synthetic or zettide_scheduled_pool_vhost_config.serial is string
      - zettide_scheduled_pool_synthetic or zettide_scheduled_pool_vhost_config.path is match('^[^:\x00-\x1f\x7f]+$')
      - zettide_scheduled_pool_synthetic or zettide_scheduled_pool_vhost_config.serial is match('^[^:\x00-\x1f\x7f]+$')
      - >-
        zettide_scheduled_pool_synthetic or
        zettide_scheduled_pool_vhost_config.secondary is not defined or
        zettide_scheduled_pool_vhost_config.secondary is mapping
      - ansible_play_hosts_all | length == 1
      - zettide_vhost_scheduled_pool_read_policy in ['first_available', 'quorum']
      - zettide_vhost_scheduled_pool_reactor_count | string is match('^[0-9]+$')
      - zettide_vhost_scheduled_pool_reactor_count | int >= 1
      - zettide_vhost_scheduled_pool_reactor_count | int <= 16
      - zettide_vhost_scheduled_pool_concurrent_groups | default(8) | string is match('^[0-9]+$')
      - zettide_vhost_scheduled_pool_concurrent_groups | default(8) | int >= 1
      - zettide_vhost_scheduled_pool_concurrent_groups | default(8) | int <= 64
      - zettide_vhost_scheduled_pool_raw_transport | default('auto') in ['auto', 'posix', 'io_uring', 'io_uring_iopoll', 'io_uring_iopoll_sqpoll']
      - zettide_vhost_scheduled_pool_storage_transport | default('linux') in ['linux', 'spdk_nvme_pcie', 'synthetic']
      - >-
        not zettide_scheduled_pool_synthetic or
        zettide_vhost_scheduled_pool_raw_transport | default('auto') == 'auto'
      - >-
        not zettide_scheduled_pool_synthetic or
        zettide_vhost_scheduled_pool_sqpoll_cpu_base | default('') == ''
      - >-
        not zettide_scheduled_pool_synthetic or
        zettide_vhost_scheduled_pool_pcie_namespaces | default([]) | length == 0
      - zettide_vhost_scheduled_pool_perf_frequency | default(199) | string is match('^[0-9]+$')
      - zettide_vhost_scheduled_pool_perf_frequency | default(199) | int >= 1
      - zettide_vhost_scheduled_pool_sqpoll_cpu_base | default('') | string is match('^$|^[0-9]+$')
      - zettide_vhost_scheduled_pool_vcpu_cpu_base | default('') | string is match('^$|^[0-9]+$')
      - zettide_vhost_scheduled_pool_threaded_concurrency | default('') | string is match('^$|^[0-9]+$')
      - zettide_vhost_scheduled_pool_worker_count | default(2) | int >= 1
      - >-
        zettide_scheduled_pool_direct_perf or zettide_scheduled_pool_raw_vhost or
        zettide_vhost_scheduled_pool_worker_count | default(2) | int <=
        zettide_vhost_scheduled_pool_reactor_count | int
      - zettide_vhost_scheduled_pool_inline_batches | default('') | string is match('^$|^[01]$')
      - zettide_vhost_scheduled_pool_coalescing_delay_base_us | default('') | string is match('^$|^[0-9]+$')
      - zettide_vhost_scheduled_pool_coalescing_iops_threshold | default('') | string is match('^$|^[0-9]+$')
      - >-
        (zettide_vhost_scheduled_pool_coalescing_delay_base_us | default('') | string | length == 0) ==
        (zettide_vhost_scheduled_pool_coalescing_iops_threshold | default('') | string | length == 0)
      - >-
        zettide_vhost_scheduled_pool_coalescing_delay_base_us | default('') | string | length == 0 or
        zettide_vhost_scheduled_pool_coalescing_delay_base_us | int >= 1
      - >-
        zettide_vhost_scheduled_pool_coalescing_delay_base_us | default('') | string | length == 0 or
        zettide_vhost_scheduled_pool_coalescing_delay_base_us | int <= 4294967295
      - >-
        zettide_vhost_scheduled_pool_coalescing_iops_threshold | default('') | string | length == 0 or
        zettide_vhost_scheduled_pool_coalescing_iops_threshold | int >= 100
      - >-
        zettide_vhost_scheduled_pool_coalescing_iops_threshold | default('') | string | length == 0 or
        zettide_vhost_scheduled_pool_coalescing_iops_threshold | int <= 429496729
      - zettide_vhost_scheduled_pool_target_gdb | default(0) | int in [0, 1]
      - >-
        not zettide_scheduled_pool_cpu_profile or
        zettide_vhost_scheduled_pool_cpu_profile_case == zettide_vhost_scheduled_pool_fio_case
      - >-
        not zettide_scheduled_pool_cpu_profile or
        zettide_vhost_scheduled_pool_perf_case | default('') == ''
      - not zettide_scheduled_pool_cpu_profile or not zettide_scheduled_pool_direct_perf
      - >-
        not zettide_scheduled_pool_cpu_profile or
        zettide_vhost_scheduled_pool_target_gdb | default(0) | int == 0
      - zettide_vhost_scheduled_pool_guest_vcpus | string is match('^[0-9]+$')
      - zettide_vhost_scheduled_pool_guest_vcpus | int >= 1
      - zettide_vhost_scheduled_pool_queues | string is match('^[0-9]+$')
      - zettide_vhost_scheduled_pool_queues | int >= 1
      - zettide_vhost_scheduled_pool_queues | int <= zettide_vhost_scheduled_pool_guest_vcpus | int
      - zettide_spdk_nvme_perf_io_depth | default(256) | string is match('^[1-9][0-9]*$')
      - zettide_spdk_nvme_perf_io_depth | default(256) | int <= 65535
      - zettide_spdk_nvme_perf_core_mask | default('0x3') | string is match('^(0[xX][0-9a-fA-F]+|[1-9][0-9]*)$')
      - >-
        zettide_vhost_scheduled_pool_fio_case in
        ['', 'seq-read-1m-qd32-j1', 'seq-read-128k-qd1-j1',
        'randread-4k-qd1-j1', 'randread-4k-qd32-j1', 'randread-4k-qd32-j4',
        'randread-4k-qd32-j16', 'randread-4k-qd256-j1-per-device']
      - >-
        ansible_facts.processor_vcpus is not defined or
        zettide_vhost_scheduled_pool_reactor_count | int <= ansible_facts.processor_vcpus | int
    fail_msg: >-
      Configure a supported scheduled Pool vhost benchmark.

- name: Detect secondary scheduled Pool disk | {{ zettide_optimize }}
  ansible.builtin.set_fact:
    zettide_scheduled_pool_vhost_secondary_enabled: >-
      {{ not zettide_scheduled_pool_synthetic and
         zettide_scheduled_pool_vhost_config.secondary is defined }}

- name: Validate secondary scheduled Pool disk configuration | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_scheduled_pool_vhost_config.secondary.path is defined
      - zettide_scheduled_pool_vhost_config.secondary.serial is defined
      - zettide_scheduled_pool_vhost_config.secondary.path is string
      - zettide_scheduled_pool_vhost_config.secondary.serial is string
      - zettide_scheduled_pool_vhost_config.secondary.path is match('^[^:\x00-\x1f\x7f]+$')
      - zettide_scheduled_pool_vhost_config.secondary.serial is match('^[^:\x00-\x1f\x7f]+$')
      - >-
        zettide_scheduled_pool_vhost_config.secondary.path !=
        zettide_scheduled_pool_vhost_config.path
      - >-
        zettide_scheduled_pool_vhost_config.secondary.serial !=
        zettide_scheduled_pool_vhost_config.serial
    fail_msg: "Configure secondary.path and secondary.serial as a distinct device."
  when: zettide_scheduled_pool_vhost_secondary_enabled

- name: Validate SPDK PCIe namespace configuration | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_scheduled_pool_vhost_secondary_enabled
      - zettide_vhost_scheduled_pool_pcie_namespaces | default([]) is sequence
      - zettide_vhost_scheduled_pool_pcie_namespaces | default([]) | length == 2
      - zettide_vhost_scheduled_pool_pcie_namespaces[0] is match('^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]/1$')
      - zettide_vhost_scheduled_pool_pcie_namespaces[1] is match('^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]/1$')
      - zettide_vhost_scheduled_pool_pcie_namespaces[0] != zettide_vhost_scheduled_pool_pcie_namespaces[1]
      - zettide_vhost_scheduled_pool_raw_transport | default('auto') == 'auto'
      - zettide_vhost_scheduled_pool_sqpoll_cpu_base | default('') == ''
      - zettide_vhost_scheduled_pool_pcie_preparation_mode | default('create') in ['create', 'validate']
      - zettide_raw_timeout | int >= 300
    fail_msg: >-
      SPDK PCIe requires two distinct canonical BDF/1 namespaces, Linux raw
      transport auto, and no SQPOLL CPU base.
  when: zettide_vhost_scheduled_pool_storage_transport | default('linux') == 'spdk_nvme_pcie'

- name: Validate direct SPDK NVMe perf configuration | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_vhost_scheduled_pool_storage_transport | default('linux') == 'spdk_nvme_pcie'
      - zettide_vhost_scheduled_pool_pcie_preparation_mode | default('create') == 'validate'
      - zettide_nvmf_scheduled_pool_expected_pool_id | default('') is match('^[0-9a-f]{32}$')
    fail_msg: >-
      Direct SPDK NVMe perf requires SPDK PCIe transport, validation-only Pool
      preparation, and the expected Pool ID.
  when: zettide_scheduled_pool_direct_perf

- name: Validate raw SPDK NVMe vhost configuration | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_vhost_scheduled_pool_storage_transport | default('linux') == 'spdk_nvme_pcie'
      - zettide_vhost_scheduled_pool_pcie_preparation_mode | default('create') == 'validate'
      - zettide_nvmf_scheduled_pool_expected_pool_id | default('') is match('^[0-9a-f]{32}$')
      - zettide_vhost_scheduled_pool_reactor_count | int == 2
      - >-
        zettide_vhost_scheduled_pool_fio_case in
        ['randread-4k-qd32-j16', 'randread-4k-qd256-j1-per-device']
    fail_msg: >-
      Raw SPDK NVMe vhost requires two reactors, SPDK PCIe transport,
      validation-only Pool preparation, the expected Pool ID, and a supported
      random-read case.
  when: zettide_scheduled_pool_raw_vhost

- name: Normalize scheduled Pool disk arguments | {{ zettide_optimize }}
  ansible.builtin.set_fact:
    zettide_scheduled_pool_vhost_device_args: >-
      {{ [] if zettide_scheduled_pool_synthetic else
         [zettide_scheduled_pool_vhost_config.path,
          zettide_scheduled_pool_vhost_config.serial] +
         ([zettide_scheduled_pool_vhost_config.secondary.path,
           zettide_scheduled_pool_vhost_config.secondary.serial]
          if zettide_scheduled_pool_vhost_secondary_enabled else []) }}
    zettide_scheduled_pool_vhost_expected_confirmation: >-
      {{ '' if zettide_scheduled_pool_synthetic else
         (('DESTROY:spdk_nvme_pcie:' ~ zettide_scheduled_pool_vhost_config.path ~ ':' ~
          zettide_scheduled_pool_vhost_config.serial ~ ':' ~
          zettide_vhost_scheduled_pool_pcie_namespaces[0] ~ ':' ~
          zettide_scheduled_pool_vhost_config.secondary.path ~ ':' ~
          zettide_scheduled_pool_vhost_config.secondary.serial ~ ':' ~
          zettide_vhost_scheduled_pool_pcie_namespaces[1])
         if zettide_vhost_scheduled_pool_storage_transport | default('linux') == 'spdk_nvme_pcie'
          else ('DESTROY:' ~ zettide_scheduled_pool_vhost_config.path ~ ':' ~
           zettide_scheduled_pool_vhost_config.serial ~
           (':' ~ zettide_scheduled_pool_vhost_config.secondary.path ~ ':' ~
            zettide_scheduled_pool_vhost_config.secondary.serial
            if zettide_scheduled_pool_vhost_secondary_enabled else ''))) }}

- name: Require exact scheduled Pool destruction confirmation | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - >-
        zettide_scheduled_pool_nvmf_fio_confirm | default('') ==
        zettide_scheduled_pool_vhost_expected_confirmation
    fail_msg: >-
      Pass -e zettide_scheduled_pool_nvmf_fio_confirm={{
      zettide_scheduled_pool_vhost_expected_confirmation }}.
  when: not zettide_scheduled_pool_synthetic

- name: Validate optional scheduled Pool reuse identity | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - >-
        (zettide_scheduled_pool_synthetic and
         zettide_nvmf_scheduled_pool_expected_pool_id | default('') == '') or
        (not zettide_scheduled_pool_synthetic and
         (zettide_nvmf_scheduled_pool_expected_pool_id | default('') == '' or
          zettide_nvmf_scheduled_pool_expected_pool_id is match('^[0-9a-f]{32}$')))
    fail_msg: "Expected scheduled Pool ID must be 32 lowercase hexadecimal characters."

- name: Create scheduled Pool vhost result directory | {{ zettide_optimize }}
  ansible.builtin.file:
    path: "{{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/{{ zettide_scheduled_pool_result_name }}"
    state: directory
    mode: "0755"

- name: Create the vhost image cache | {{ zettide_optimize }}
  ansible.builtin.file:
    path: /var/cache/zettide
    state: directory
    mode: "0755"
  when: not zettide_scheduled_pool_direct_perf

- name: Download the verified Fedora guest image | {{ zettide_optimize }}
  ansible.builtin.get_url:
    url: "{{ zettide_vhost_scheduled_pool_image_url }}"
    dest: /var/cache/zettide/fedora-cloud-base.qcow2
    checksum: "sha256:{{ zettide_vhost_scheduled_pool_image_sha256 }}"
    mode: "0644"
  environment: >-
    {{ {'http_proxy': zettide_vhost_scheduled_pool_download_proxy,
        'https_proxy': zettide_vhost_scheduled_pool_download_proxy}
       if zettide_vhost_scheduled_pool_download_proxy | default('') | length > 0
       else {} }}
  when: not zettide_scheduled_pool_direct_perf

- name: Extract SPDK source | {{ zettide_optimize }}
  ansible.builtin.unarchive:
    src: "{{ zettide_controller_staging.path }}/spdk-source.tar.gz"
    dest: "{{ zettide_remote_workspace.path }}"

- name: Configure shared SPDK without RDMA | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - ./configure
      - --with-shared
      - --without-rdma
      - --without-uring
      - --disable-tests
      - --disable-unit-tests
      - --disable-examples
      - --disable-apps
      - --without-nvme-cuse
      - --without-fsdev
  args:
    chdir: "{{ zettide_remote_workspace.path }}/spdk"
  changed_when: true

- name: Build SPDK | {{ zettide_optimize }}
  ansible.builtin.command:
    argv: [make, "-j{{ ansible_facts.processor_vcpus | default(2) }}"]
  args:
    chdir: "{{ zettide_remote_workspace.path }}/spdk"
  changed_when: true

- name: Build SPDK NVMe perf | {{ zettide_optimize }}
  ansible.builtin.command:
    argv: [make, "-j{{ ansible_facts.processor_vcpus | default(2) }}"]
  args:
    chdir: "{{ zettide_remote_workspace.path }}/spdk/app/spdk_nvme_perf"
  changed_when: true
  when: zettide_scheduled_pool_direct_perf

- name: Build scheduled Pool target library | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - "{{ zettide_zig }}"
      - build
      - -Dspdk=true
      - -Doptimize=ReleaseSafe
      - "-Dbenchmark-cpu-profiler={{ zettide_scheduled_pool_cpu_profile | ternary('true', 'false') }}"
      - build-nvmf-pool-data-benchmark
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    PKG_CONFIG_PATH: "{{ zettide_remote_workspace.path }}/spdk/build/lib/pkgconfig"
    http_proxy: "{{ zettide_vhost_scheduled_pool_download_proxy | default('') }}"
    https_proxy: "{{ zettide_vhost_scheduled_pool_download_proxy | default('') }}"
  changed_when: true

- name: Build Zettide CLI | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - "{{ zettide_zig }}"
      - build
      - -Doptimize=ReleaseSafe
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    http_proxy: "{{ zettide_vhost_scheduled_pool_download_proxy | default('') }}"
    https_proxy: "{{ zettide_vhost_scheduled_pool_download_proxy | default('') }}"
  changed_when: true

- name: Link scheduled Pool vhost target | {{ zettide_optimize }}
  ansible.builtin.shell:
    cmd: >-
      cc -O3 -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Wno-unused-parameter
      {{ '-fno-omit-frame-pointer' if zettide_scheduled_pool_cpu_profile else '' }}
      -Isrc -Itest src/spdk/runtime.c src/spdk/bdev_endpoint.c
      src/spdk/bdev_dispatcher.c src/spdk/bdev_provider.c
      src/spdk/nvmf_tcp_export.c src/spdk/vhost_blk_controller.c
      test/spdk_runtime.c test/spdk_pool_data_nvmf_benchmark_main.c
      zig-out/lib/libzettide-spdk-pool-data-nvmf-benchmark.a
      {{ zettide_scheduled_pool_profiler_link_args if zettide_scheduled_pool_cpu_profile else '' }}
      -o test/spdk-pool-data-vhost-benchmark -pthread -lstdc++ -Wl,--no-as-needed
      $(PKG_CONFIG_PATH=./spdk/build/lib/pkgconfig pkg-config --cflags --libs
      spdk_event spdk_event_bdev spdk_vhost spdk_event_vhost_blk spdk_event_nvmf
      spdk_bdev_modules spdk_env_dpdk spdk_nvmf spdk_sock_modules spdk_syslibs)
      -Wl,--as-needed
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  vars:
    zettide_scheduled_pool_profiler_link_args: >-
      zig-out/lib/zettide-benchmark-cpu-profiler-force-link.o
      zig-out/lib/libzettide-benchmark-cpu-profiler.a
  changed_when: true

- name: Discover SPDK shared library paths | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - pkg-config
      - --libs-only-L
      - spdk_event
      - spdk_event_bdev
      - spdk_vhost
      - spdk_event_vhost_blk
      - spdk_event_nvmf
      - spdk_bdev_modules
      - spdk_env_dpdk
      - spdk_nvmf
      - spdk_sock_modules
      - spdk_syslibs
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    PKG_CONFIG_PATH: "{{ zettide_remote_workspace.path }}/spdk/build/lib/pkgconfig"
  changed_when: false
  register: zettide_scheduled_pool_vhost_spdk_library_flags

- name: Run destructive scheduled Pool vhost lifecycle | {{ zettide_optimize }}
  ansible.builtin.command:
    argv: >-
      {{ ['flock', '--no-fork', '--nonblock', '/var/lock/zettide-raw-device.lock'] +
         (['timeout', '--signal=TERM', '--kill-after=90s',
           (((zettide_raw_timeout | int) - 120) | string) ~ 's']
          if zettide_vhost_scheduled_pool_storage_transport | default('linux') == 'spdk_nvme_pcie'
          else []) +
         ['bash', 'test/scheduled-pool-nvmf-fio.sh',
          zettide_remote_workspace.path ~ '/zig-out/bin/zettide'] +
         zettide_scheduled_pool_vhost_device_args }}
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    LD_LIBRARY_PATH: >-
      {{ zettide_scheduled_pool_vhost_spdk_library_flags.stdout.split()
         | map('regex_replace', '^-L', '') | join(':') }}
    ZETTIDE_SCHEDULED_POOL_NVMF_FIO_CONFIRM: "{{ zettide_scheduled_pool_nvmf_fio_confirm | default('') }}"
    ZETTIDE_SCHEDULED_POOL_NVMF_TARGET: "{{ zettide_remote_workspace.path }}/test/spdk-pool-data-vhost-benchmark"
    ZETTIDE_SCHEDULED_POOL_NVMF_READ_POLICY: "{{ zettide_vhost_scheduled_pool_read_policy }}"
    ZETTIDE_SCHEDULED_POOL_NVMF_EXPECTED_POOL_ID: "{{ zettide_nvmf_scheduled_pool_expected_pool_id | default('') }}"
    ZETTIDE_SCHEDULED_POOL_BENCHMARK_DRIVER: "{{ 'test/spdk-nvme-perf.sh' if zettide_scheduled_pool_direct_perf else 'test/spdk-vhost-user-blk-fio.sh' }}"
    ZETTIDE_SCHEDULED_POOL_BENCHMARK_LOG_NAME: >-
      {{ 'spdk-nvme-perf' if zettide_scheduled_pool_direct_perf
         else ('vhost-spdk-nvme' if zettide_scheduled_pool_raw_vhost else 'vhost') }}
    ZETTIDE_SCHEDULED_POOL_PROFILE: "{{ zettide_scheduled_pool_result_name }}"
    ZETTIDE_SCHEDULED_POOL_RAW_WINDOWS: "{{ '0' if zettide_scheduled_pool_synthetic else '1' }}"
    ZETTIDE_NVMF_REACTOR_COUNT: "{{ zettide_vhost_scheduled_pool_reactor_count }}"
    ZETTIDE_POOL_DATA_CONCURRENT_GROUPS: "{{ zettide_vhost_scheduled_pool_concurrent_groups | default(8) }}"
    ZETTIDE_POOL_DATA_RAW_TRANSPORT: "{{ zettide_vhost_scheduled_pool_raw_transport | default('auto') }}"
    ZETTIDE_POOL_DATA_STORAGE_TRANSPORT: "{{ zettide_vhost_scheduled_pool_storage_transport | default('linux') }}"
    ZETTIDE_POOL_DATA_BENCHMARK_MODE: "{{ 'raw_nvme' if zettide_scheduled_pool_raw_vhost else 'pool' }}"
    ZETTIDE_POOL_DATA_PCIE_NAMESPACES: "{{ zettide_vhost_scheduled_pool_pcie_namespaces | default([]) | join(',') }}"
    ZETTIDE_POOL_DATA_PCIE_PREPARATION_MODE: >-
      {{ 'none' if zettide_scheduled_pool_synthetic else
         zettide_vhost_scheduled_pool_pcie_preparation_mode | default('create') }}
    ZETTIDE_VHOST_PERF_CASE: "{{ zettide_vhost_scheduled_pool_perf_case | default('') }}"
    ZETTIDE_VHOST_PERF_FREQUENCY: "{{ zettide_vhost_scheduled_pool_perf_frequency | default(199) }}"
    ZETTIDE_VHOST_CPU_PROFILE_CASE: "{{ zettide_vhost_scheduled_pool_cpu_profile_case | default('') }}"
    ZETTIDE_POOL_DATA_SQPOLL_CPU_BASE: "{{ zettide_vhost_scheduled_pool_sqpoll_cpu_base | default('') }}"
    ZETTIDE_VHOST_VCPU_CPU_BASE: "{{ zettide_vhost_scheduled_pool_vcpu_cpu_base | default('') }}"
    ZETTIDE_POOL_DATA_THREADED_CONCURRENCY: "{{ zettide_vhost_scheduled_pool_threaded_concurrency | default('') }}"
    ZETTIDE_VHOST_WORKER_COUNT: "{{ zettide_vhost_scheduled_pool_worker_count | default(2) }}"
    ZETTIDE_VHOST_INLINE_BATCHES: "{{ zettide_vhost_scheduled_pool_inline_batches | default('') }}"
    ZETTIDE_VHOST_COALESCING_DELAY_BASE_US: "{{ zettide_vhost_scheduled_pool_coalescing_delay_base_us | default('') }}"
    ZETTIDE_VHOST_COALESCING_IOPS_THRESHOLD: "{{ zettide_vhost_scheduled_pool_coalescing_iops_threshold | default('') }}"
    ZETTIDE_VHOST_TARGET_GDB: "{{ zettide_vhost_scheduled_pool_target_gdb | default(0) }}"
    ZETTIDE_VHOST_BASE_IMAGE: /var/cache/zettide/fedora-cloud-base.qcow2
    ZETTIDE_VHOST_GUEST_VCPUS: "{{ zettide_vhost_scheduled_pool_guest_vcpus }}"
    ZETTIDE_VHOST_QUEUES: "{{ zettide_vhost_scheduled_pool_queues }}"
    ZETTIDE_VHOST_FIO_SIZE: "{{ zettide_vhost_scheduled_pool_fio_size }}"
    ZETTIDE_VHOST_FIO_CASE: "{{ zettide_vhost_scheduled_pool_fio_case }}"
    ZETTIDE_VHOST_FIO_RUNTIME: "{{ zettide_nvmf_fio_runtime }}"
    ZETTIDE_VHOST_FIO_RAMP_TIME: "{{ zettide_nvmf_fio_ramp_time }}"
    ZETTIDE_SPDK_NVME_PERF_BINARY: "{{ zettide_remote_workspace.path }}/spdk/build/bin/spdk_nvme_perf"
    ZETTIDE_SPDK_NVME_PERF_IO_DEPTH: "{{ zettide_spdk_nvme_perf_io_depth | default(256) }}"
    ZETTIDE_SPDK_NVME_PERF_CORE_MASK: "{{ zettide_spdk_nvme_perf_core_mask | default('0x3') }}"
    ZETTIDE_SPDK_NVME_PERF_RUNTIME: "{{ zettide_nvmf_fio_runtime }}"
    ZETTIDE_SPDK_NVME_PERF_WARMUP_TIME: "{{ zettide_nvmf_fio_ramp_time }}"
    ZETTIDE_TEST_LOG_DIR: "{{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/{{ zettide_scheduled_pool_result_name }}"
  async: "{{ zettide_raw_timeout }}"
  poll: 15
  changed_when: true
  failed_when: false
  register: zettide_scheduled_pool_vhost_result

- name: Record scheduled Pool vhost lifecycle | {{ zettide_optimize }}
  ansible.builtin.copy:
    content: |-
      rc={{ zettide_scheduled_pool_vhost_result.rc | default(1) }}
      {{ zettide_scheduled_pool_vhost_result.stdout | default('') }}
      {{ zettide_scheduled_pool_vhost_result.stderr | default(zettide_scheduled_pool_vhost_result.msg | default('')) }}
    dest: "{{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/{{ zettide_scheduled_pool_result_name }}/ansible.log"
    mode: "0644"

- name: Require scheduled Pool vhost lifecycle | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_scheduled_pool_vhost_result.rc | default(1) == 0
    fail_msg: "Scheduled Pool benchmark failed; inspect the fetched logs."
