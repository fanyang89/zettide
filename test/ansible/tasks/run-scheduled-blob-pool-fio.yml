---
- name: Initialize scheduled Blob Pool fio configuration | {{ zettide_optimize }}
  ansible.builtin.set_fact:
    zettide_scheduled_blob_pool_fio_config: "{{ zettide_raw_device | default({}) }}"

- name: Require explicit scheduled Blob Pool fio configuration | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_scheduled_blob_pool_fio_config.path is defined
      - zettide_scheduled_blob_pool_fio_config.serial is defined
      - zettide_scheduled_blob_pool_fio_config.pool_id is defined
      - zettide_scheduled_blob_pool_fio_config.backup_dir is defined
      - zettide_scheduled_blob_pool_fio_config.path | length > 0
      - zettide_scheduled_blob_pool_fio_config.serial | length > 0
      - zettide_scheduled_blob_pool_fio_config.pool_id | length == 32
      - >-
        (zettide_scheduled_blob_pool_fio_config.pool_id |
        regex_search('^[0-9a-f]{32}$')) == zettide_scheduled_blob_pool_fio_config.pool_id
      - zettide_scheduled_blob_pool_fio_config.backup_dir | length > 0
      - ansible_play_hosts_all | length == 1
      - >-
        zettide_scheduled_blob_pool_fio_confirm | default('') ==
        'DESTROY:' ~ zettide_scheduled_blob_pool_fio_config.path ~ ':' ~
        zettide_scheduled_blob_pool_fio_config.serial
    fail_msg: >-
      Configure path, serial, pool_id, and backup_dir, then pass
      -e zettide_scheduled_blob_pool_fio_confirm=DESTROY:<path>:<serial>.

- name: Create scheduled Blob Pool fio result directory | {{ zettide_optimize }}
  ansible.builtin.file:
    path: >-
      {{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/scheduled-blob-pool-fio
    state: directory
    mode: "0755"

- name: Build Zettide for scheduled Blob Pool fio | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - "{{ zettide_zig }}"
      - build
      - -Doptimize={{ zettide_optimize }}
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  changed_when: false

- name: Run destructive synthetic scheduled Blob Pool fio lifecycle | {{ zettide_optimize }}
  ansible.builtin.command:
    argv:
      - flock
      - --nonblock
      - /var/lock/zettide-raw-device.lock
      - bash
      - test/scheduled-blob-pool-fio.sh
      - "{{ zettide_remote_workspace.path }}/zig-out/bin/zettide"
      - "{{ zettide_scheduled_blob_pool_fio_config.path }}"
      - "{{ zettide_scheduled_blob_pool_fio_config.serial }}"
      - "{{ zettide_scheduled_blob_pool_fio_config.pool_id }}"
      - >-
        {{ zettide_scheduled_blob_pool_fio_config.backup_dir }}/zettide-scheduled-blob-pool-fio-{{ inventory_hostname }}-{{ ansible_facts['date_time']['iso8601_basic_short'] }}-{{ zettide_source_revision.stdout[:12] }}.img
  args:
    chdir: "{{ zettide_remote_workspace.path }}"
  environment:
    ZETTIDE_SCHEDULED_BLOB_POOL_FIO_CONFIRM: "{{ zettide_scheduled_blob_pool_fio_confirm }}"
    ZETTIDE_RAW_KEEP_BACKUP: "{{ '1' if zettide_raw_keep_backup | bool else '0' }}"
    ZETTIDE_SCHEDULED_BLOB_POOL_FIO_RUNTIME: "{{ zettide_scheduled_blob_pool_fio_runtime }}"
    ZETTIDE_SCHEDULED_BLOB_POOL_FIO_RAMP_TIME: "{{ zettide_scheduled_blob_pool_fio_ramp_time }}"
    ZETTIDE_TEST_LOG_DIR: >-
      {{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/scheduled-blob-pool-fio
  async: "{{ zettide_raw_timeout }}"
  poll: 15
  changed_when: true
  failed_when: false
  register: zettide_scheduled_blob_pool_fio_result

- name: Record scheduled Blob Pool fio lifecycle | {{ zettide_optimize }}
  ansible.builtin.copy:
    content: |-
      rc={{ zettide_scheduled_blob_pool_fio_result.rc | default(1) }}
      stdout:
      {{ zettide_scheduled_blob_pool_fio_result.stdout | default('') }}
      stderr:
      {{ zettide_scheduled_blob_pool_fio_result.stderr | default(zettide_scheduled_blob_pool_fio_result.msg | default('')) }}
    dest: >-
      {{ zettide_remote_workspace.path }}/test-results/{{ zettide_optimize }}/scheduled-blob-pool-fio/ansible.log
    mode: "0644"

- name: Require scheduled Blob Pool fio lifecycle | {{ zettide_optimize }}
  ansible.builtin.assert:
    that:
      - zettide_scheduled_blob_pool_fio_result.rc | default(1) == 0
    fail_msg: >-
      Synthetic scheduled Blob Pool fio failed. Inspect the fetched
      scheduled-blob-pool-fio logs and retain the full-device backup.
