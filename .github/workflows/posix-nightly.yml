name: POSIX nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posix-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    env:
      ZETTIDE_EXTERNAL_ROOT: ${{ github.workspace }}/test/external/.prepared
      ZETTIDE_TEST_LOG_DIR: ${{ github.workspace }}/test-results
      ZETTIDE_KEEP_TEST_ARTIFACTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acl attr autoconf automake bc build-essential dbench dump e2fsprogs \
            fio fuse3 gawk git indent libacl1-dev libaio-dev libattr1-dev \
            libcap-dev libgdbm-compat-dev libgdbm-dev libtest-harness-perl \
            libtool libtool-bin liburing-dev linux-headers-$(uname -r) lvm2 \
            openssl perl psmisc quota sqlite3 uuid-dev uuid-runtime xfsprogs \
            xfslibs-dev
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse

      - name: Prepare pinned suites
        run: |
          mkdir -p "$ZETTIDE_TEST_LOG_DIR"
          set -o pipefail
          bash test/external/prepare.sh "$ZETTIDE_EXTERNAL_ROOT" \
            2>&1 | tee "$ZETTIDE_TEST_LOG_DIR/prepare.log"

      - name: Run nightly gates
        run: |
          set -o pipefail
          zig build -j1 test-posix-nightly \
            -Dfuse-tests=required \
            -Dexternal-tests=required \
            -Dprivileged-tests=required \
            -Doptimize=${{ matrix.optimize }} \
            2>&1 | tee "$ZETTIDE_TEST_LOG_DIR/nightly.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-nightly-${{ matrix.optimize }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
