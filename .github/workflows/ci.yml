name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Run portable block CI gate
        run: zig build ci build-spdk-tests -Doptimize=${{ matrix.optimize }}
      - name: Run raw block device gate
        run: zig build test-linux-block -Dblock-tests=required -Doptimize=${{ matrix.optimize }}
