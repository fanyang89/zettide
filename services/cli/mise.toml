[tools]
go = "1.26.5"
protoc = "36.0"

[tasks.generate]
run = [
  "mkdir -p .tools/bin",
  "GOBIN=$PWD/.tools/bin go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11",
  "GOBIN=$PWD/.tools/bin go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1",
  "PATH=$PWD/.tools/bin:$PATH ./scripts/gen-proto.sh",
]

[tasks.check]
run = [
  "gofmt -d cmd internal",
  "go vet ./...",
  "go test ./...",
  "CGO_ENABLED=0 go build -trimpath -o /tmp/zettidectl ./cmd/zettidectl",
]
